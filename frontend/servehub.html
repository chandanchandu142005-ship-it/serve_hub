              <div class="chat-box" style="height:320px">
                <div class="chat-body" id="chat-body">${chat.map(m => msgHtml(m)).join('') || `<div class="small muted center" style="margin:auto">Say hello to your professional 👋</div>`}</div>
                <div class="chat-input-row"><input class="input" id="chat-input" placeholder="Type a message…" aria-label="Message"><button class="btn btn-primary" id="chat-send">${icon('send', 0)}</button></div>
              </div>
            </div>
          </div>

        <div class="card" style="padding:26px;margin-top:24px">

          <div class="grid g2" style="grid-template-columns:1fr 1fr;gap:8px 40px">
            <div class="sum-row"><span class="muted">Booking ID</span><b>${b.id}</b></div>
            <div class="sum-row"><span class="muted">Invoice</span><b>${b.invoiceNo}</b></div>
            <div class="sum-row"><span class="muted">Package</span><b>${b.pack} • ${b.dur}</b></div>
            <div class="sum-row"><span class="muted">Payment</span><b>${b.payMethod.toUpperCase()}</b></div>
            <div class="sum-row"><span class="muted">Address</span><b style="max-width:280px;text-align:right">${esc(b.address)}</b></div>
            <div class="sum-row"><span class="muted">Notes</span><b>${esc(b.notes) || '—'}</b></div>
            <div class="sum-row"><span class="muted">Subtotal</span><b>${money(b.sub)}</b></div>
            ${b.disc ? `<div class="sum-row" style="color:var(--success-600)"><span>Coupon ${esc(b.coupon || '')}</span><b>−${money(b.disc)}</b></div>` : ''}
            <div class="sum-row"><span class="muted">GST 18%</span><b>${money(b.gst)}</b></div>
            <div class="sum-row"><span class="muted">Total</span><b style="font-size:16px">${money(b.total)}</b></div>
          </div>
          ${done && !b.rating ? `<div class="card glass" style="margin-top:18px;padding:18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap"><div style="flex:1;min-width:200px"><b>How was your service?</b><div class="small muted">Rate your experience and earn bonus points.</div></div><button class="btn btn-cta" data-act="rate" data-id="${b.id}">${icon('star', 15)} Rate experience</button></div>` : ''}
          ${done && b.rating ? `<div class="card glass" style="margin-top:18px;padding:18px;display:flex;align-items:center;gap:12px">${icon('starF', 22)}<div><b>You rated this booking ${b.rating}★</b><div class="small muted">${esc(b.rateText || 'Thanks for your feedback!')}</div></div></div>` : ''}
        </div>`}
      </div>
    </section>`;
  };

  const msgHtml = m => `<div class="msg ${m.from === 'me' ? 'me' : 'them'}">${esc(m.text)}<span class="m-time">${fmtTime(m.time)}</span></div>`;

  const TrackWire = root => {
    const b = Store.bookingById(location.hash.split('/')[2]);
    if (!b || ['cancelled', 'rejected', 'rated'].includes(b.status)) return;
    const iv = setInterval(() => {
      const bb = Store.bookingById(b.id);
      if (!bb) { clearInterval(iv); return; }
      if (['cancelled', 'paid', 'rated'].includes(bb.status)) { clearInterval(iv); U.toast('Payment complete — ₹' + (bb.cashback ? bb.cashback : 0) + ' cashback added', 'success'); return; }
      const nb = Store.advanceBooking(b.id);
      if (nb) reRender();
    }, 12000);
    timers.push(iv);
    // chat
    const send = () => {
      const inp = U.$('#chat-input', root); const text = (inp.value || '').trim();
      if (!text) return; inp.value = '';
      Store.sendMsg(b.id, text, 'me');
      const body = U.$('#chat-body', root);
      body.insertAdjacentHTML('beforeend', msgHtml({ text, from: 'me', time: Date.now() }));
      body.scrollTop = body.scrollHeight;
      setTimeout(() => {
        body.insertAdjacentHTML('beforeend', `<div class="msg them typing"><i></i><i></i><i></i></div>`);
        body.scrollTop = body.scrollHeight;
        setTimeout(() => {
          const typing = U.$('.msg.typing', root); if (typing) typing.remove();
          const replies = ['Got it! I will be there on time 👍', 'Sure, no problem at all.', 'Thanks for letting me know! See you soon. 😊', 'Yes, that works perfectly for me.'];
          const text = replies[Math.floor(Math.random() * replies.length)];
          Store.sendMsg(b.id, text, 'them');
          body.insertAdjacentHTML('beforeend', msgHtml({ text, from: 'them', time: Date.now() }));
          body.scrollTop = body.scrollHeight;
        }, 1400);
      }, 600);
    };
    U.$('#chat-send', root)?.addEventListener('click', send);
    U.$('#chat-input', root)?.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
  };
  const reRender = () => { window.App && App.refresh(); };

  /* ---------------- INVOICE ---------------- */
  const Invoice = ({ id }) => {
    const b = Store.bookingById(id);
    if (!b) return `<section class="section"><div class="container"><div class="empty-state"><div class="e-ic">${icon('alert', 30)}</div><h3>Invoice not found</h3></div></div></section>`;
    const cgst = Math.round(b.gst / 2), sgst = b.gst - cgst;
    const pro = DATA.proById(b.proId);
    return `
    <section class="section" style="padding-top:calc(var(--nav-h) + 28px)">
      <div class="container" style="max-width:820px">

          <button class="btn btn-primary btn-sm" onclick="window.print()">${icon('printer', 14)} Print / Save PDF</button>
        </div>
        <div class="card" style="padding:44px;border-top:4px solid var(--primary)">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:16px;margin-bottom:32px">
            <div><div style="display:flex;align-items:center;gap:10px"><span class="logo-mark">${icon('zap', 20)}</span><b style="font-size:22px">Serve<b style="color:var(--primary-600)">hub</b></b></div>
              <p class="small muted" style="margin-top:8px">One Hub Tower, BKC, Mumbai 400051<br>GSTIN: 27ABCDE1234F1Z5 • CIN: U74999MH2021PTC000000</p></div>
            <div style="text-align:right"><b style="font-size:15px">TAX INVOICE</b><div class="small muted">${b.invoiceNo}</div><div class="small muted">${fmtDate(Date.now())}</div></div>
          </div>
          <div style="display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:30px">
            <div><b class="small" style="text-transform:uppercase;letter-spacing:.06em">Billed to</b><div class="small" style="margin-top:6px">${esc(Store.currentUser()?.name || 'Customer')}<br>${esc(b.address)}<br>${esc(Store.currentUser()?.email || '')}</div></div>
            <div><b class="small" style="text-transform:uppercase;letter-spacing:.06em">Booking</b><div class="small" style="margin-top:6px">${b.id} • ${fmtDate(b.date)}<br>${esc(b.serviceName)}<br>Expert: ${esc(b.proName)}</div></div>
          </div>
          <div class="tbl-wrap"><div class="tbl-scroll"><table>
            <thead><tr><th>Item</th><th>Qty</th><th>Rate</th><th>Amount</th></tr></thead>
            <tbody><tr><td><b>${esc(b.serviceName)}</b><div class="xsmall muted">${b.pack} • ${b.dur}</div></td><td>1</td><td>${money(b.sub)}</td><td><b>${money(b.sub)}</b></td></tr>
            ${b.disc ? `<tr><td>Coupon (${esc(b.coupon)})</td><td>−</td><td></td><td><b style="color:var(--success-600)">−${money(b.disc)}</b></td></tr>` : ''}
            <tr><td>GST — CGST (9%)</td><td></td><td></td><td>${money(cgst)}</td></tr>
            <tr><td>GST — SGST (9%)</td><td></td><td></td><td>${money(sgst)}</td></tr></tbody>
          </table></div></div>
          <div style="display:flex;justify-content:flex-end;margin-top:20px">
            <div style="min-width:240px"><div class="sum-row"><span class="muted">Subtotal</span><b>${money(b.sub)}</b></div><div class="sum-row"><span class="muted">Discount</span><b>−${money(b.disc || 0)}</b></div><div class="sum-row"><span class="muted">GST (18%)</span><b>${money(b.gst)}</b></div><div class="sum-total"><span>Total</span><span class="grad-text">${money(b.total)}</span></div></div>
          </div>
          <div class="small muted" style="margin-top:30px;padding-top:20px;border-top:1px dashed var(--line);display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px">
            <span>${b.payMethod.toUpperCase()} • ${b.walletUsed ? 'Wallet ₹' + b.walletUsed + ' used' : 'Paid online'} • Payment status: <b style="color:var(--success-600)">PAID</b></span>
            <span>Thank you for choosing Servehub! ❤️</span>
          </div>
        </div>
      </div>
    </section>`;
  };

  /* ---------------- MODALS: rate / call / video / chat / reschedule ---------------- */
  const rateModal = b => {
    openModal(modalShell(`Rate your experience`, `
      <div style="text-align:center;margin-bottom:18px">${avatar(b.proName, 60)}<b style="display:block;margin-top:10px">${esc(b.proName)}</b><div class="xsmall muted">${b.serviceName}</div></div>
      <div class="stars-input" id="rate-stars" style="margin-bottom:16px">${[1, 2, 3, 4, 5].map(i => `<button data-r="${i}" aria-label="${i} stars">${icon('starF', 30)}</button>`).join('')}</div>
      <div class="field"><label class="label">What went well?</label><div class="radio-pill">${['On time', 'Professional', 'Clean & tidy', 'Good value', 'Skilled'].map(t => `<label><input type="checkbox" class="rate-tag" value="${t}"><span>${t}</span></label>`).join('')}</div></div>
      <div class="field"><label class="label" for="rate-text">Share more (optional)</label><textarea class="textarea" id="rate-text" placeholder="How was your experience?"></textarea></div>
      <div class="field"><label class="label">Add photos</label><label class="upload-zone" for="rate-file" style="padding:16px"><div class="u-ic" style="width:40px;height:40px">${icon('camera', 18)}</div><b style="font-size:13px">Upload up to 3 photos</b><input type="file" id="rate-file" accept="image/*" multiple style="display:none"></label><div id="rate-imgs" style="display:flex;gap:8px;margin-top:10px"></div></div>`,
      `<button class="btn btn-primary" id="rate-submit">${icon('check', 15)} Submit review</button>`));
    let r = 0; const imgs = [];
    U.$$('#rate-stars button').forEach(btn => btn.addEventListener('click', () => { r = Number(btn.dataset.r); U.$$('#rate-stars button').forEach((b, i) => b.classList.toggle('on', i < r)); }));
    U.$('#rate-file').addEventListener('change', async e => {
      for (const f of Array.from(e.target.files).slice(0, 3)) {
        if (f.size > 1.5 * 1024 * 1024) { toast(f.name + ' is over 1.5 MB — skipped', 'warn'); continue; }
        imgs.push(await fileToDataURL(f));
      }
      U.$('#rate-imgs').innerHTML = imgs.map(src => `<img src="${src}" style="width:64px;height:64px;border-radius:12px;object-fit:cover;border:1px solid var(--line)">`).join('');
    });
    U.$('#rate-submit').addEventListener('click', async () => {
      if (!r) { toast('Please select a star rating', 'warn'); return; }
      const tags = U.$$('.rate-tag:checked').map(i => i.value);
      const text = U.$('#rate-text').value.trim();
      Store.rateBooking(b.id, r, text, tags, imgs);
      closeModal(); toast('Thanks for rating! ⭐ Bonus points added');
      // persist the review to the API when logged in (demo fallback: local only)
      if (localStorage.getItem('sh:token') && window.Customer && Customer.api) {
        const res = await Customer.api('POST', '/reviews', {
          bookingId: b.id, serviceId: b.serviceId || '', serviceName: b.serviceName || '',
          rating: r, text: text || tags.join(', '), images: imgs.slice(0, 3),
        });
        if (res && res.error) toast('Review saved locally — ' + res.error, 'warn');
        else if (res && res.review) toast('Review submitted for moderation ✅', 'success');
      }
      window.App && App.refresh();
    });
  };

  const callModal = (b, video = false) => {
    const pro = DATA.proById(b.proId) || { name: b.proName };
    openModal(modalShell(video ? 'Video call' : 'Calling…', `
      <div class="call-ui">
        ${video ? `<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px"><div style="background:var(--surface-2);border-radius:16px;height:130px;display:grid;place-items:center;color:var(--ink-3)">${icon('video', 26)} You</div><div style="background:linear-gradient(135deg,#1E293B,#334155);border-radius:16px;height:130px;display:grid;place-items:center;color:#fff">${avatar(pro.name, 46)}</div></div>` : `<div class="call-ava">${avatar(pro.name, 0)}</div>`}
        <b style="font-size:18px">${esc(pro.name)}</b>
        <div class="call-timer">00:00</div>
        <div class="call-actions">
          <button class="call-btn call-mute" id="call-mute" aria-label="Mute">${icon('mic', 22)}</button>
          <button class="call-btn call-end" id="call-end" aria-label="End call">${icon('phone', 22)}</button>
        </div>
        <p class="xsmall muted" style="margin-top:16px">${video ? 'Secured with end-to-end encryption' : 'Voice call • encrypted'}</p>
      </div>`));
    let s = 0; const iv = setInterval(() => {
      if (!document.querySelector('#call-end')) { clearInterval(iv); return; }
      s++; const el = U.$('.call-timer'); if (el) el.textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
    }, 1000);
    U.$('#call-end').addEventListener('click', () => { clearInterval(iv); closeModal(); toast('Call ended', 'info'); });
    U.$('#call-mute').addEventListener('click', e => { e.currentTarget.classList.toggle('on'); e.currentTarget.style.background = e.currentTarget.classList.contains('on') ? 'var(--danger)' : ''; toast(e.currentTarget.classList.contains('on') ? 'Microphone muted' : 'Microphone unmuted', 'info'); });
  };

  const chatModal = (title = 'Servehub Support') => {
    openModal(modalShell(title, `
      <div class="chat-box" style="height:380px"><div class="chat-body" id="modal-chat-body">
        <div class="msg them">Hi there! 👋 I am the Servehub assistant. How can I help you today?</div>
      </div><div class="quick-chips"><button class="quick-chip" data-q="I need to reschedule my booking">Reschedule booking</button><button class="quick-chip" data-q="Where is my refund?">Refund status</button><button class="quick-chip" data-q="Talk to a human">Talk to human</button></div>
      <div class="chat-input-row"><input class="input" id="modal-chat-input" placeholder="Type a message…"><button class="btn btn-primary" id="modal-chat-send">${icon('send', 0)}</button></div></div>`));
    const body = U.$('#modal-chat-body');
    const send = text => {
      body.insertAdjacentHTML('beforeend', `<div class="msg me">${esc(text)}<span class="m-time">now</span></div>`); body.scrollTop = body.scrollHeight;
      setTimeout(() => { body.insertAdjacentHTML('beforeend', `<div class="msg them typing"><i></i><i></i><i></i></div>`); body.scrollTop = body.scrollHeight; setTimeout(() => { U.$('.msg.typing')?.remove(); const replies = ['Sure! You can reschedule for free up to 6 hours before the slot. Which booking is this about?', 'Refunds to wallets are instant. Card refunds take 3–7 business days. Your reference is SH-pending.', 'Connecting you to a human agent… expected wait time: 1 minute 🙌']; body.insertAdjacentHTML('beforeend', `<div class="msg them">${replies[Math.floor(Math.random() * replies.length)]}<span class="m-time">now</span></div>`); body.scrollTop = body.scrollHeight; }, 1300); }, 500);
    };
    U.$$('.quick-chip').forEach(c => c.addEventListener('click', () => send(c.dataset.q)));
    U.$('#modal-chat-send').addEventListener('click', () => { const i = U.$('#modal-chat-input'); send(i.value.trim()); i.value = ''; });
    U.$('#modal-chat-input').addEventListener('keydown', e => { if (e.key === 'Enter') { const i = U.$('#modal-chat-input'); send(i.value.trim()); i.value = ''; } });
  };

  const reschedModal = b => {
    const slots = ['10:00 AM', '12:00 PM', '02:00 PM', '04:00 PM', '06:00 PM'];
    openModal(modalShell('Reschedule booking ' + b.id, `
      <div class="field"><label class="label">New date</label><input class="input" type="date" id="rs-date" min="${new Date().toISOString().slice(0, 10)}"></div>
      <div class="field"><label class="label">New time</label><div class="radio-pill">${slots.map(s => `<label><input type="radio" name="rs-slot" value="${s}"><span>${s}</span></label>`).join('')}</div></div>
      <p class="xsmall muted">Free rescheduling — your slot is held instantly.</p>`, `<button class="btn btn-ghost" data-act="close-modal">Cancel</button><button class="btn btn-primary" id="rs-save">${icon('refreshCw', 14)} Reschedule</button>`));
    U.$('#rs-save').addEventListener('click', () => {
      const d = U.$('#rs-date').value, t = U.$('input[name="rs-slot"]:checked');
      if (!d || !t) { toast('Pick a date and time', 'warn'); return; }
      b.date = new Date(d + 'T00:00:00').getTime(); b.time = t.value; Store.persist();
      Store.addNotif('calendar', 'Booking rescheduled', `Booking ${b.id} is now scheduled for ${fmtDate(b.date)} at ${b.time}.`);
      closeModal(); toast('Rescheduled successfully ✅'); window.App && App.refresh();
    });
  };

  const cancelModal = b => {
    openModal(modalShell('Cancel booking ' + b.id, `
      <div style="display:flex;gap:14px;margin-bottom:14px"><span class="e-ic" style="width:48px;height:48px;border-radius:14px;background:var(--danger-50);color:var(--danger);display:grid;place-items:center;flex:none">${icon('calendarX', 22)}</span><p class="small muted" style="padding-top:4px">You will receive a <b style="color:var(--ink)">full refund of ${money(b.total)}</b> ${b.walletUsed ? 'to your wallet' : 'to your payment method'}. This cannot be undone.</p></div>`,
      `<button class="btn btn-ghost" data-act="close-modal">Keep booking</button><button class="btn btn-danger" id="cnf-cancel">${icon('trash', 14)} Yes, cancel booking</button>`));
    U.$('#cnf-cancel').addEventListener('click', () => {
      b.status = 'cancelled'; Store.persist();
      Store.walletTx(b.walletUsed || 0, 'refund for ' + b.id);
      if (!b.walletUsed) Store.addNotif('wallet', 'Refund initiated', `₹${b.total} refund for ${b.id} will reflect in 3–7 business days.`);
      closeModal(); toast('Booking cancelled — refund processed 💸'); window.App && App.refresh();
    });
  };

  const render = (name, params) => {
    const map = {
      'book': { html: () => BookFlow(params), wire: BookWire },
      'track': { html: () => TrackPage(params), wire: TrackWire },
      'invoice': { html: () => Invoice(params), wire: null },
    };
    const r = map[name];
    return r ? { html: r.html(), wire: r.wire } : null;
  };

  return { render, clearTimers, chatModal, callModal, rateModal, reschedModal, cancelModal };
})();

</script>
  <script>
/* ============ SERVEHUB CUSTOMER DASHBOARD ============ */
window.Customer = (() => {
  const { icon, money, esc, stars, avatar, toast, openModal, closeModal, modalShell, fmtDate, fmtTime, timeAgo, statusPill } = U;
  const u = () => Store.currentUser() || {};

  /* ---- live API sync (reviews, addresses, tickets, notifications) ---- */
  const API_BASE = window.SH_API || window.SERVEHUB_API || 'http://localhost:4000/api';
  const api = (method, path, body, timeout = 6000) => {
    const token = localStorage.getItem('sh:token') || '';
    return fetch(API_BASE + path, {
      method,
      headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) },
      body: body ? JSON.stringify(body) : undefined,
      signal: (typeof AbortSignal !== 'undefined' && AbortSignal.timeout) ? AbortSignal.timeout(timeout) : undefined,
    }).then(r => r.json()).catch(() => null);
  };
  const live = { addr: false, notifs: false, tickets: false, uid: null };
  // reset sync flags whenever the signed-in user changes (prevents cross-user data leaks)
  const liveUser = () => {
    const uid = (Store.currentUser() || {}).id ?? null;
    if (uid !== live.uid) { live.addr = live.notifs = live.tickets = false; live.uid = uid; }
  };

  const normAddr = a => ({ id: a.id, label: a.label || 'Address', line: a.line || '', area: a.area || '', city: a.city || '', pin: a.pincode || '', primary: !!a.isDefault, _live: true });
  const notifIcon = t => ({ booking: 'calendar', payment: 'card', offer: 'gift', system: 'bell', support: 'headset' }[t] || 'bell');
  const normNotif = n => ({ id: n.id, icon: notifIcon(n.type), title: n.title || 'Notification', msg: n.body || '', type: n.type || 'system', time: Date.parse(n.createdAt) || Date.now(), read: !!n.read, link: n.link || '', _live: true });
  const normTicket = t => ({ id: t.id, cat: t.category || 'Other', subject: t.subject || 'Ticket', msg: (t.messages && t.messages[0] && t.messages[0].text) || '', status: t.status || 'open', createdAt: Date.parse(t.createdAt) || Date.now(), messages: t.messages || [], _live: true });

  // Pull the current user's live data into local state (falls back to demo data offline).
  const syncLive = async tab => {
    liveUser();
    if (!localStorage.getItem('sh:token')) return false; // demo mode — keep local data
    try {
      if (tab === 'addresses' && !live.addr) {
        const r = await api('GET', '/addresses');
        if (r && r.addresses) { Store.state.addr = r.addresses.map(normAddr); Store.persist(); live.addr = true; return true; }
      }
      if (tab === 'notifications' && !live.notifs) {
        const r = await api('GET', '/notifications');
        if (r && r.notifications) { Store.state.notifs = r.notifications.map(normNotif); Store.persist(); live.notifs = true; return true; }
      }
      if (tab === 'support' && !live.tickets) {
        const r = await api('GET', '/tickets');
        if (r && r.tickets) { Store.state.tickets = r.tickets.map(normTicket); Store.persist(); live.tickets = true; return true; }
      }
    } catch (e) { /* keep demo data */ }
    return false;
  };

  // Add / edit address modal — persists to the API when logged in, demo otherwise.
  const addrModal = (a = null) => {
    openModal(modalShell(a ? 'Edit address' : 'Add new address', `
      <div style="margin-bottom:14px">
        <button type="button" class="btn btn-soft btn-block" id="al-detect-btn" style="display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 14px;font-weight:600">
          ${icon('navigation', 16)} Use current device location
        </button>
        <div id="al-detect-status" class="small center" style="margin-top:6px"></div>
      </div>
      <div class="field"><label class="label">Label</label><div class="radio-pill" id="al-labels">${['Home', 'Office', 'Other'].map(l => `<label><input type="radio" name="al-label" value="${l}" ${(a ? a.label : 'Home') === l ? 'checked' : ''}><span>${l}</span></label>`).join('')}</div></div>
      <div class="field"><label class="label" for="al-line">Address line</label><input class="input" id="al-line" value="${esc(a ? a.line : '')}" placeholder="House no, street, building"></div>
      <div class="grid g2" style="grid-template-columns:1fr 1fr;gap:12px">
        <div class="field"><label class="label" for="al-area">Area / locality</label><input class="input" id="al-area" value="${esc(a ? a.area : '')}" placeholder="e.g. Indiranagar"></div>
        <div class="field"><label class="label" for="al-city">City</label><input class="input" id="al-city" value="${esc(a ? a.city : '')}" placeholder="e.g. Bengaluru"></div>
      </div>
      <div class="field"><label class="label" for="al-pin">PIN code</label><input class="input" id="al-pin" value="${esc(a ? a.pin : '')}" placeholder="6-digit" inputmode="numeric" maxlength="6"></div>
      <label class="pack-row" style="cursor:pointer;margin-top:8px"><input type="checkbox" id="al-default" ${!a || a.primary ? 'checked' : ''} style="display:none"><span style="display:flex;gap:10px;align-items:center">${icon('check', 15)} <span><b>Set as default address</b><br><span class="pk-desc">New bookings will use this by default</span></span></span></label>`,
      `<button class="btn btn-ghost" data-act="close-modal">Cancel</button><button class="btn btn-primary" id="al-save">${icon('check', 15)} Save address</button>`));
    
    // Device location detection handler
    U.$('#al-detect-btn')?.addEventListener('click', () => {
      const btn = U.$('#al-detect-btn');
      const status = U.$('#al-detect-status');
      if (!('geolocation' in navigator)) {
        if (status) status.innerHTML = `<span style="color:var(--danger-600)">Browser location detection is not supported.</span>`;
        toast('Location not supported', 'warn');
        return;
      }
      btn.disabled = true;
      btn.innerHTML = `${icon('timer', 16)} Requesting location permission…`;
      if (status) status.innerHTML = `<span style="color:var(--primary-600)">Please allow location access on your device…</span>`;

      navigator.geolocation.getCurrentPosition(async pos => {
        btn.innerHTML = `${icon('timer', 16)} Fetching location address…`;
        const { latitude, longitude } = pos.coords;
        try {
          let line = '', area = '', city = '', pin = '';
          const res = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${latitude}&longitude=${longitude}&localityLanguage=en`);
          if (res.ok) {
            const data = await res.json();
            city = data.city || data.principalSubdivision || '';
            area = data.locality || data.localityInfo?.informative?.[0]?.name || '';
            line = [data.locality, data.city].filter(Boolean).join(', ');
            pin = data.postcode || '';
          }
          if (!line || !city) {
            const res2 = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}`);
            if (res2.ok) {
              const data2 = await res2.json();
              const addr = data2.address || {};
              line = data2.display_name ? data2.display_name.split(',').slice(0, 3).join(',') : line;
              area = addr.suburb || addr.neighbourhood || addr.residential || area;
              city = addr.city || addr.town || addr.state_district || city;
              pin = addr.postcode || pin;
            }
          }
          if (line && U.$('#al-line')) U.$('#al-line').value = line;
          if (area && U.$('#al-area')) U.$('#al-area').value = area;
          if (city && U.$('#al-city')) U.$('#al-city').value = city;
          if (pin && U.$('#al-pin')) U.$('#al-pin').value = pin.replace(/\D/g, '').slice(0, 6);
          if (status) status.innerHTML = `<span style="color:var(--success-600)">📍 Current location loaded!</span>`;
          toast('📍 Device location detected');
        } catch (e) {
          if (status) status.innerHTML = `<span style="color:var(--warn-600)">Could not reverse-geocode location. Please type manually.</span>`;
        } finally {
          btn.disabled = false;
          btn.innerHTML = `${icon('navigation', 16)} Use current device location`;
        }
      }, err => {
        btn.disabled = false;
        btn.innerHTML = `${icon('navigation', 16)} Use current device location`;
        if (err.code === 1) {
          if (status) status.innerHTML = `<span style="color:var(--danger-600)">Location permission denied. Allow location in browser settings.</span>`;
          toast('Location permission denied', 'warn');
        } else {
          if (status) status.innerHTML = `<span style="color:var(--danger-600)">Location unavailable. Please enter address manually.</span>`;
          toast('Could not detect location', 'warn');
        }
      }, { enableHighAccuracy: true, timeout: 10000 });
    });

    let saving = false;
    U.$('#al-save').addEventListener('click', async () => {
      if (saving) return; saving = true;
      const line = (U.$('#al-line').value || '').trim();
      if (!line) { saving = false; toast('Address line is required', 'warn'); return; }
      const payload = {
        label: (U.$('input[name="al-label"]:checked') || { value: 'Home' }).value,
        line, area: U.$('#al-area').value.trim(), city: U.$('#al-city').value.trim(),
        pincode: U.$('#al-pin').value.trim(), isDefault: !!U.$('#al-default')?.checked,
      };
      if (a && a._live) {
        const r = await api('PATCH', '/addresses/' + a.id, payload);
        if (!r || r.error) { toast((r && r.error) || 'Could not save address', 'warn'); return; }
        Store.state.addr = Store.state.addr.map(x => x.id === a.id ? normAddr(r.address) : x);
        if (payload.isDefault) Store.state.addr.forEach(x => { if (x.id !== a.id) x.primary = false; });
      } else if (!a && localStorage.getItem('sh:token')) {
        const r = await api('POST', '/addresses', payload);
        if (!r || !r.address) { toast((r && r.error) || 'Could not save address', 'warn'); return; }
        Store.state.addr.unshift(normAddr(r.address));
        if (payload.isDefault) Store.state.addr.forEach(x => { if (x.id !== r.address.id) x.primary = false; });
      } else if (a) {
        // editing demo/local address (API unreachable) — mutate in place, don't duplicate
        a.label = payload.label; a.line = line; a.area = payload.area; a.city = payload.city; a.pin = payload.pincode; a.primary = !!payload.isDefault;
        if (payload.isDefault) Store.state.addr.forEach(x => x.primary = x === a);
      } else {
        const demo = { id: 'a' + Date.now(), label: payload.label, line, area: payload.area, city: payload.city, pin: payload.pincode, primary: payload.isDefault };

      <div class="chat-box" style="height:300px;margin-bottom:12px"><div class="chat-body" id="th-body" style="display:flex;flex-direction:column;gap:8px">
        ${msgs.map(m => `<div class="msg ${m.from === 'customer' ? 'me' : 'them'}">${esc(m.text)}<span class="m-time">${fmtTime(Date.parse(m.createdAt) || Date.now())}</span></div>`).join('') || `<div class="small muted center" style="margin:auto">No messages yet — our team will reply soon 👋</div>`}
      </div></div>
      <div class="chat-input-row"><input class="input" id="th-input" placeholder="Write a reply…" aria-label="Reply"><button class="btn btn-primary" id="th-send">${icon('send', 0)}</button></div>`,
      `<button class="btn btn-ghost" data-act="close-modal">Close</button>`));
    let sending = false;
    const send = async () => {
      if (sending) return; sending = true;
      const inp = U.$('#th-input'); const text = (inp.value || '').trim();
      if (!text) { sending = false; return; } inp.value = '';
      if (t._live && localStorage.getItem('sh:token')) {
        const r = await api('POST', '/tickets/' + t.id + '/reply', { text });
        if (!r || !r.ticket) { sending = false; toast((r && r.error) || 'Reply failed — try again', 'warn'); inp.value = text; return; }
        t.messages = r.ticket.messages || t.messages; t.status = r.ticket.status || t.status;
      } else {
        t.messages = t.messages || []; t.messages.push({ from: 'customer', text, createdAt: new Date().toISOString() });
      }
      U.$('#th-body').insertAdjacentHTML('beforeend', `<div class="msg me">${esc(text)}<span class="m-time">${fmtTime(Date.now())}</span></div>`);
      U.$('#th-body').scrollTop = U.$('#th-body').scrollHeight;
      sending = false;
      toast('Reply sent 💬');

        </div>
      </div>`;
    },
  };

  const iconBg = n => ({ wallet: 'linear-gradient(135deg,#10B981,#14B8A6)', calendar: 'linear-gradient(135deg,#2563EB,#0EA5E9)', user: 'linear-gradient(135deg,#6366F1,#8B5CF6)', navigation: 'linear-gradient(135deg,#F59E0B,#F97316)', card: 'linear-gradient(135deg,#8B5CF6,#EC4899)', star: 'linear-gradient(135deg,#F59E0B,#FBBF24)', gift: 'linear-gradient(135deg,#EC4899,#F43F5E)', headset: 'linear-gradient(135deg,#0EA5E9,#06B6D4)', briefcase: 'linear-gradient(135deg,#64748B,#0EA5E9)', bell: 'linear-gradient(135deg,#F43F5E,#EC4899)' }[n] || 'linear-gradient(135deg,#2563EB,#0EA5E9)');

  const empty = (ic, title, sub) => `<div class="tbl-empty"><div class="e-ic" style="width:64px;height:64px;border-radius:18px;background:var(--surface-2);display:grid;place-items:center;margin:0 auto 12px;color:var(--ink-4)">${icon(ic, 26)}</div><b>${title}</b><p class="small muted" style="margin-top:4px">${sub}</p></div>`;

  const svcCardSmall = s => `
    <div class="card card-hover svc-card"><div class="svc-art"><div class="art-bg" style="background:${s.g}">${icon(s.icon, 40)}</div><button class="art-heart on" data-act="wish" data-id="${s.id}" style="color:var(--danger)">${icon('heart', 15)}</button></div>

  const render = (params) => {
    const tab = params.tab || 'overview';
    if (!Store.isLoggedIn()) { location.hash = '#/login'; return { html: '', wire: null }; }
    if (u().role === 'pro') { location.hash = '#/pro/overview'; return { html: '', wire: null }; }
    if (!tabs[tab]) return { html: layout('overview', tabs.overview()), wire: () => wireCommon('overview') };
    const html = layout(tab, tabs[tab]());
    const wire = () => wireCommon(tab);
    return { html, wire };
  };

  const wireCommon = tab => {
    // counters on overview
    U.$$('[data-count]').forEach(el => U.countUp(el, Number(el.dataset.count)));
    U.observeReveals();
    // live-sync addresses / notifications / support from the API (demo fallback)
    if (['addresses', 'notifications', 'support'].includes(tab)) {
      syncLive(tab).then(ok => { if (ok) { window.App && App.refresh(); toast({ addresses: 'Saved addresses synced 📍', notifications: 'Notifications synced 🔔', support: 'Tickets synced 🎧' }[tab], 'success'); } });
    }
    // bookings filter
    const fwrap = U.$('#bk-filter');
    if (fwrap) U.$$('[data-f]', fwrap).forEach(btn => btn.addEventListener('click', () => {
      U.$$('[data-f]', fwrap).forEach(b => b.classList.toggle('on', b === btn));
      const f = btn.dataset.f;
      const list = Store.state.bookings.filter(b => f === 'all' || (f === 'active' ? !['cancelled', 'paid', 'rated'].includes(b.status) : f === 'done' ? ['paid', 'rated'].includes(b.status) : b.status === 'cancelled'));
      U.$('#bk-list').innerHTML = list.map(bookingRow).join('') || empty('calendar', 'Nothing here', 'No bookings match this filter.');
    }));
    // live tab auto refresh
    if (tab === 'live' && U.$('[data-live-bk]')) {
      const iv = setInterval(() => {
        U.$$('[data-live-bk]').forEach(card => {
          const b = Store.bookingById(card.dataset.liveBk);
          if (!b) return;
          U.$('[data-live-pill]', card).innerHTML = statusPill(b.status);
          if (['cancelled', 'paid', 'rated'].includes(b.status)) { card.style.opacity = .5; }
        });
      }, 4000);
      window.__custLive = iv;
    }
  };

  return { render, bookingRow, walletLedger, api, syncLive, addrModal, ticketThread, normTicket, normAddr, normNotif };
})();

</script>

  };

  const mini = (ic, title, cls = '') => `<button class="mini-btn ${cls}" data-act="toast" data-msg="${title} → (demo)" title="${title}" aria-label="${title}">${icon(ic, 14)}</button>`;

  /* ================= LIVE-MANAGED TABS =================
     coupons / giftcards / plans / tickets / reviews load from the admin API
     when reachable; otherwise they fall back to local demo data so the panel
     is always usable. Every mutation re-renders the tab body. */
  const MANAGED = ['coupons', 'giftcards', 'plans', 'tickets', 'reviews'];
  const mgrState = {}; // per-tab cache: { src: 'api'|'demo', items: [...] }

  const mgrShell = name => `
    <div class="card" style="padding:8px">
      <div id="mgr-body" data-mgr="${name}" style="min-height:200px">
        <div class="center" style="padding:60px 0">${icon('loader', 24)} <div class="small muted" style="margin-top:10px">Loading ${name}…</div></div>
      </div>
    </div>`;

  const srcBadge = (src, liveCount) => src === 'api'
    ? `<span class="badge badge-success" style="margin-right:8px">${icon('server', 12)} Live · ${liveCount}</span>`
    : `<span class="badge badge-neutral" style="margin-right:8px">${icon('zap', 12)} Demo data</span>`;

  const statusChip = (st, map = {}) => `<span class="badge ${map[st] || 'badge-neutral'}">${(st || '').replace(/-/g, ' ')}</span>`;

  const managedLoad = async name => {
    const body = U.$('#mgr-body');
    if (!body) return;
    const render = MANAGED_RENDER[name];
    const prev = mgrState[name];
    let src = 'demo';
    let items = prev && prev.src === 'demo' ? prev.items : demoItems(name); // keep demo edits across reloads
    const live = await apiGet('/admin/' + name);
    if (live && (live.coupons || live.giftCards || live.plans || live.tickets || live.reviews)) {
      src = 'api';
      items = live.coupons || live.giftCards || live.plans || live.tickets || live.reviews || [];
    }
    mgrState[name] = { src, items };
    body.innerHTML = render(items, src);
    wireManagedActions(body, name);
    wireTableSearch(body);
  };

  const demoItems = name => {
    if (name === 'coupons') return DATA.coupons.map(c => ({ code: c.code, type: c.type === 'pct' ? 'percent' : 'flat', value: c.value, minAmount: c.min || 0, cap: c.cap || null, active: true, description: c.desc, validUntil: c.valid }));
    if (name === 'plans') return DATA.plans.map(p => ({ id: p.id, name: p.name, price: p.price, period: p.per, featured: !!p.featured, active: true, perks: p.perks }));
    if (name === 'tickets') return Store.state.tickets.map(t => ({ id: t.id, customerName: Store.currentUser()?.name || 'Customer', subject: t.subject, category: t.cat || 'other', status: t.status, priority: 'medium', messages: [{ from: 'customer', text: t.msg || '', createdAt: t.createdAt }] }));
    if (name === 'reviews') return DATA.reviews.map((r, i) => ({ id: i + 1, customerName: r.name, serviceName: 'Deep Cleaning', rating: r.rating, text: r.text, status: 'published', verified: r.v, helpful: r.helpful, createdAt: r.date }));
    return [];
  };

  /* -------- renderers per managed tab -------- */
  const MANAGED_RENDER = {
    coupons(items, src) {
      const rows = items.map(c => ({
        cells: [`<b style="letter-spacing:.04em">${esc(c.code)}</b>`, c.type === 'percent' ? `${c.value}% off${c.cap ? ' (max ' + money(c.cap) + ')' : ''}` : money(c.value), money(c.minAmount || 0), c.description || '—', c.validUntil || '—', `<span class="badge ${c.active === false ? 'badge-neutral' : 'badge-success'}">${c.active === false ? 'Inactive' : 'Active'}</span>`],
        actions: [
