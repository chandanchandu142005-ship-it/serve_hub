  <script>
/* ============ SERVEHUB API BASE ============
   Auto-detects the backend host so login works from the laptop
   (localhost) AND from a phone on the same Wi-Fi (LAN IP).
   Override anytime with window.SERVEHUB_API. */
window.SH_API = (() => {
  if (window.SERVEHUB_API) return window.SERVEHUB_API;
  const h = ((location && location.hostname) || '').toLowerCase();
  // Empty hostname = page opened directly from disk (file://) — use localhost.
  if (/^(|localhost|127\.0\.0\.1|0\.0\.0\.0|::1)$/.test(h)) return 'http://localhost:4000/api';
  // IPv6 hostnames need brackets: http://[fe80::1]:4000/api
  return h.includes(':') ? `http://[${h}]:4000/api` : `http://${h}:4000/api`;
})();

/* ============ PWA — installable app for phone + laptop ============
   Exposes window.SH_PWA: captures the browser's beforeinstallprompt,
   registers the service worker (offline shell), and reports whether the
   app is installed (standalone) or installable. UI lives in app.js. */
window.SH_PWA = (() => {
  let deferredPrompt = null;
  const isStandalone = () =>
    (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
    window.navigator.standalone === true;
  const canInstall = () => !!deferredPrompt && !isStandalone();
  const init = () => {
    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      deferredPrompt = e;
      document.dispatchEvent(new CustomEvent('sh:pwa-ready'));
    });
    window.addEventListener('appinstalled', () => {
      deferredPrompt = null;
      document.dispatchEvent(new CustomEvent('sh:pwa-installed'));
    });
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => { /* non-secure context etc. */ });
      });
    }
    if (isStandalone()) document.dispatchEvent(new CustomEvent('sh:pwa-standalone'));
  };
  const promptInstall = async () => {
    if (!deferredPrompt) return false;
    deferredPrompt.prompt();
    let accepted = false;
    try { const choice = await deferredPrompt.userChoice; accepted = choice.outcome === 'accepted'; } catch (e) { /* dismissed */ }
    deferredPrompt = null;
    return accepted;
  };
  return { init, isStandalone, canInstall, promptInstall };
})();

/* ============ SERVEHUB STATE (localStorage) ============ */
window.Store = (() => {
  const P = 'sh:';
  const load = (k, d) => { try { const v = localStorage.getItem(P + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } };
  const save = (k, v) => { try { localStorage.setItem(P + k, JSON.stringify(v)); } catch (e) {} };

  const STATUSES = [
    { key: 'confirmed', label: 'Booking Confirmed', icon: 'check', cls: 'badge-success' },
    { key: 'assigned',  label: 'Professional Assigned', icon: 'user', cls: 'badge-primary' },
    { key: 'arriving',  label: 'Professional Arriving', icon: 'navigation', cls: 'badge-primary' },
    { key: 'started',   label: 'Service Started', icon: 'zap', cls: 'badge-warn' },
    { key: 'completed', label: 'Service Completed', icon: 'check', cls: 'badge-success' },
    { key: 'paid',      label: 'Payment Complete', icon: 'card', cls: 'badge-success' },
    { key: 'rated',     label: 'Rate Experience', icon: 'star', cls: 'badge-neutral' },
  ];

  const state = {
    user: load('user', null),
    theme: load('theme', 'light'),
    lang: load('lang', 'en'),
    bookings: load('bookings', []),
    wallet: load('wallet', 250),
    points: load('points', 120),
    favs: load('favs', []),        // professional ids
    wish: load('wish', []),        // service ids
    addr: load('addr', [
      { id: 'a1', label: 'Home', line: 'B-402, Sunrise Residency, Linking Road', city: 'Mumbai', area: 'Bandra', pin: '400050', primary: true },
      { id: 'a2', label: 'Office', line: '15th Floor, One Hub Tower, BKC', city: 'Mumbai', area: 'BKC', pin: '400051', primary: false },
    ]),
    notifs: load('notifs', []),
    tickets: load('tickets', []),
    chats: load('chats', {}),
    plan: load('plan', 'free'),
    // Selected city/area (displayed as "📍 Bengaluru, Karnataka"). Migrates
    // the legacy sh:city key; never stores exact coordinates.
    location: load('location', (() => { try { const c = localStorage.getItem('sh:city'); return c ? { city: c, area: '' } : { city: 'Mumbai', area: '' }; } catch (e) { return { city: 'Mumbai', area: '' }; } })()),
    giftcards: load('giftcards', []),
    withdrawals: load('withdrawals', []),
    proApps: load('proApps', []),
    coupons: load('coupons', []),   // unlocked coupon codes
    settings: load('settings', { push: true, email: true, sms: false, whatsapp: true, saveCards: true }),
  };

  const persist = () => { Object.keys(state).forEach(k => save(k, state[k])); };

  const currentUser = () => state.user;
  const isLoggedIn = () => !!state.user;
  const login = u => {
    state.user = u;
    if (u && u.token) localStorage.setItem('sh:token', u.token);
    else localStorage.removeItem('sh:token');
    persist();
  };
  const logout = () => { state.user = null; localStorage.removeItem('sh:token'); persist(); };

  const statusIndex = b => STATUSES.findIndex(s => s.key === b.status);
  const statusMeta = b => STATUSES[Math.max(0, Math.min(statusIndex(b), STATUSES.length - 1))];

  const addNotif = (icon, title, msg, type = 'badge-primary') => {
    state.notifs.unshift({ id: 'n' + Date.now(), icon, title, msg, type, time: Date.now(), read: false });
    if (state.notifs.length > 40) state.notifs.pop();
    persist();
  };

  const addBooking = (o) => {
    const b = { id: 'SH' + Math.floor(100000 + Math.random() * 900000), status: 'confirmed', createdAt: Date.now(), invoiceNo: 'INV-' + Math.floor(100000 + Math.random() * 900000), ...o };
    state.bookings.unshift(b);
    persist();
    return b;
  };
  const bookingById = id => state.bookings.find(b => b.id === id);

  const advanceBooking = (id, to) => {
    const b = bookingById(id); if (!b) return null;
    let idx = STATUSES.findIndex(s => s.key === b.status);
    if (to) idx = STATUSES.findIndex(s => s.key === to);
    else idx = Math.min(idx + 1, STATUSES.length - 1);
    b.status = STATUSES[idx].key;
    if (b.status === 'completed') {
      b.cashback = Math.round(b.total * 0.1);
      state.wallet += b.cashback;
      const pts = 10;
      state.points += pts;
      addNotif('wallet', 'Cashback credited', `₹${b.cashback} added to your wallet + ${pts} reward points for ${b.id}.`);
    }
    if (b.status === 'paid') addNotif('card', 'Payment complete', `Your payment of ₹${b.total} for ${b.id} was successful.`);
    if (b.status === 'assigned') addNotif('user', 'Professional assigned', `${b.proName || 'Your expert'} is assigned to booking ${b.id}.`);
    if (b.status === 'arriving') addNotif('navigation', 'On the way', `${b.proName || 'Your expert'} is arriving for booking ${b.id}.`);
    persist();
    return b;
  };

  const rateBooking = (id, rating, text, tags, imgs) => {
    const b = bookingById(id); if (!b) return;
    if (b.status === 'cancelled' || b.status === 'rejected') return;
    b.rating = rating; b.rateText = text; b.rateTags = tags; b.rateImgs = imgs || [];
    if (statusIndex(b) < STATUSES.length - 1) b.status = 'rated';
    if (rating >= 4) state.points += 15;
    addNotif('star', 'Thanks for rating!', `You earned ${rating >= 4 ? '15 bonus' : ''} reward points for rating booking ${b.id}.`);
    persist();
  };

  const toggleFav = pid => { const i = state.favs.indexOf(pid); i >= 0 ? state.favs.splice(i, 1) : state.favs.push(pid); persist(); return i < 0; };
  const toggleWish = sid => { const i = state.wish.indexOf(sid); i >= 0 ? state.wish.splice(i, 1) : state.wish.push(sid); persist(); return i < 0; };
  const isFav = pid => state.favs.includes(pid);
  const isWish = sid => state.wish.includes(sid);

  const walletTx = (amt, note) => { state.wallet += amt; addNotif('wallet', amt >= 0 ? 'Wallet credited' : 'Wallet debited', `${amt >= 0 ? '+' : ''}₹${Math.abs(amt)} ${note}.`); persist(); };
  const addPoints = n => { state.points += n; persist(); };

  const applyCoupon = (code, sub) => {
    const c = DATA.coupons.find(x => x.code.toLowerCase() === code.toLowerCase());
    if (!c) return { ok: false, msg: 'Invalid coupon code' };
    if (sub < c.min) return { ok: false, msg: `Minimum order value ₹${c.min} required` };
    const disc = c.type === 'pct' ? Math.min(Math.round(sub * c.value / 100), c.cap || Infinity) : c.value;
    if (!state.coupons.includes(c.code)) { state.coupons.push(c.code); persist(); }
    return { ok: true, disc, c };
  };

  const sendMsg = (bookingId, text, from) => {
    if (!state.chats[bookingId]) state.chats[bookingId] = [];
    state.chats[bookingId].push({ id: 'm' + Date.now(), text, from, time: Date.now() });
    persist();
    return state.chats[bookingId];
  };
  const getChat = bookingId => state.chats[bookingId] || [];

  const createTicket = t => { state.tickets.unshift({ id: 'TK' + Math.floor(1000 + Math.random() * 9000), ...t, createdAt: Date.now(), status: 'open' }); addNotif('headset', 'Ticket created', `Support ticket ${state.tickets[0].id} has been raised.`); persist(); return state.tickets[0]; };
  const markAllRead = () => { state.notifs.forEach(n => n.read = true); persist(); };
  const unreadCount = () => state.notifs.filter(n => !n.read).length;

  const demoPro = () => ({ id: 'p2', name: 'Rahul Sharma', role: 'AC & Appliance Expert', phone: '+91 98765 43210' });

  /* ---- location (city/area only — never exact coordinates) ---- */
  const setLocation = loc => {
    state.location = { ...(state.location || {}), ...loc };
    try { localStorage.setItem('sh:city', state.location.city || ''); } catch (e) {}
    persist();
    return currentLocation();
  };
  const currentLocation = () => {
    const l = state.location || { city: 'Mumbai', area: '' };
    const city = window.DATA ? DATA.cities.find(c => c.name === l.city) : null;
    const label = l.area
      ? `${l.area}, ${l.city}`
      : city ? `${l.city}, ${city.state}` : l.city || 'Mumbai';
    return { ...l, label, state: city ? city.state : '' };
  };

  return { state, persist, STATUSES, currentUser, isLoggedIn, login, logout, addBooking, bookingById, advanceBooking, rateBooking, statusIndex, statusMeta, toggleFav, toggleWish, isFav, isWish, walletTx, addPoints, applyCoupon, sendMsg, getChat, createTicket, markAllRead, unreadCount, addNotif, demoPro, setLocation, currentLocation };
})();

    els.forEach(e => io.observe(e));

  const countUp = (el, target, dur = 1100) => {
    if (!el) return;
    const t0 = performance.now();
    const step = t => { const p = Math.min((t - t0) / dur, 1); el.textContent = Math.round(target * (1 - Math.pow(1 - p, 3))).toLocaleString('en-IN'); if (p < 1) requestAnimationFrame(step); };

  const barChart = (data, labels, { unit = '' } = {}) =>
    `<div class="bars">${data.map((v, i) => {

  });
  const wireCarousel = root => (root || document).querySelectorAll('[data-carousel]').forEach(c => {

    </div></section>
    <section class="section"><div class="container" style="max-width:780px">

  staticPages.help = staticPages.faq;

      const q = inp.value.toLowerCase();
      U.$$('#faq-root .acc', root).forEach(a => {

  /* Contact form — client-side validation + success state */
  const contactWire = root => {
    const form = U.$('#contact-form', root);
    if (!form) return;
    const fieldOf = id => U.$('#' + id, root)?.closest('.field');
    const err = (id, msg) => {
      const f = fieldOf(id); if (!f) return;
      let e = f.querySelector('.field-err');
      if (msg) {
        f.classList.add('field-invalid');
        if (!e) { e = document.createElement('span'); e.className = 'field-err'; f.appendChild(e); }
        e.textContent = msg;
      } else {
        f.classList.remove('field-invalid');
        if (e) e.remove();
      }
    };
    const val = id => (U.$('#' + id, root)?.value || '').trim();
    form.addEventListener('submit', e => {
      e.preventDefault();
      let ok = true;
      const name = val('cf-name'), email = val('cf-email'), phone = val('cf-phone'), svc = val('cf-svc'), msg = val('cf-msg');
      if (name.length < 2) { err('cf-name', 'Please enter your name'); ok = false; } else err('cf-name', '');
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { err('cf-email', 'Please enter a valid email address'); ok = false; } else err('cf-email', '');

      if (!/^(91)?[6-9]\d{9}$/.test(digits)) { err('cf-phone', 'Please enter a valid 10-digit mobile number'); ok = false; } else err('cf-phone', '');

      if (msg.length < 10) { err('cf-msg', 'Please describe your query (min 10 characters)'); ok = false; } else err('cf-msg', '');
      if (!ok) { toast('Please fix the highlighted fields', 'warn'); return; }
      form.style.display = 'none';
      const success = U.$('#cf-success', root);
      if (success) success.style.display = 'block';
      toast('Message sent! Our team will reply within 2 hours ✅');
    });
  };
  const debounce = U.debounce;

  const proCardPub = proCard;
  return {
    Landing, Categories, CategoriesWire, CategoryPage, CategoryWire, ServicePage, ServiceWire,
    staticPages, Blog, BlogPost, helpSearchWire, proCard: proCardPub,
    render(name, params) {
      const map = {
        landing: () => ({ html: Landing(), wire: null }),
        categories: () => ({ html: Categories(), wire: CategoriesWire }),
        'category': () => ({ html: CategoryPage(params), wire: CategoryWire }),
        'service': () => ({ html: ServicePage(params), wire: ServiceWire }),
        'blog': () => ({ html: Blog(), wire: null }),
        'post': () => ({ html: BlogPost(params), wire: null }),
        'static': () => ({ html: staticPages[params.page]?.body || '', wire: params.page === 'contact' ? contactWire : (['faq', 'help'].includes(params.page) ? helpSearchWire : null) }),
      };
      const fn = map[name];
      return fn ? fn() : null;
    },
  };
})();

</script>
  <script>
/* ============ SERVEHUB AUTH ============ */
window.Auth = (() => {

  /* ---------------- API helper ----------------

  const API_BASE = window.SH_API || window.SERVEHUB_API || 'http://localhost:4000/api';

  const apiPost = (path, body, timeout = 6000) =>
    fetch(API_BASE + path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {}),
      signal: (typeof AbortSignal !== 'undefined' && AbortSignal.timeout) ? AbortSignal.timeout(timeout) : undefined,
    }).then(async r => {
      const data = await r.json().catch(() => ({}));
      return { ok: r.ok, status: r.status, ...data };
    }).catch(() => null);

  const authShell = (title, sub, body) => `

  const pwToggle = id => `<button type="button" class="icon-btn" data-act="pw-toggle" data-id="${id}" aria-label="Toggle password" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px">${icon('eye', 16)}</button>`;

  /* ---------------- LOGIN ---------------- */
  const Login = () => authShell('Welcome back 👋', 'Log in to manage your bookings, wallet and rewards.',
    `
    <form id="login-form" novalidate>
      <div class="field"><label class="label" for="l-role">I am a</label>
        <div class="radio-pill" role="radiogroup">
          <label><input type="radio" name="role" value="customer" checked><span>Customer</span></label>

        </div>
      </div>

      <div class="field"><label class="label" for="l-email">Email Address</label>
        <div class="input-group">${icon('mail', 17)}<input class="input input-icon-r" id="l-email" type="email" placeholder="you@example.com" required></div>
      </div>

      <div class="field"><label class="label" for="l-pass">Password</label>
        <div class="input-group">${icon('lock', 17)}<input class="input input-icon-r" id="l-pass" type="password" placeholder="••••••••" required>${pwToggle('l-pass')}</div>
      </div>

      <div style="display:flex;justify-content:space-between;align-items:center;margin:4px 0 18px">
        <label style="display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink-3);font-weight:600"><input type="checkbox" id="l-remember" checked> Remember me</label>
        <a href="#/forgot" style="font-size:13px;font-weight:700;color:var(--primary-600)">Forgot Password?</a>
      </div>

      <button class="btn btn-primary btn-lg btn-block" id="l-submit" type="submit">${icon('logout', 0)} LOGIN</button>
    </form>

    <div class="auth-divider">or continue with</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <button class="btn btn-outline" data-act="oauth" data-provider="Google">${icon('globe', 16)} Google</button>
      <button class="btn btn-outline" data-act="oauth" data-provider="Apple">${icon('lock', 16)} Apple</button>
    </div>
    <p class="auth-alt">Don't have an account? <a href="#/register">Create Account</a></p>
    <div class="center"><button class="btn btn-ghost btn-sm" data-act="demo-login">${icon('zap', 13)} Try a 1-click demo login</button></div>
  `);

  const loginWire = root => {
    // Password toggle
    U.$$('[data-act="pw-toggle"]', root).forEach(btn => btn.addEventListener('click', () => {
      const inp = U.$('#' + btn.dataset.id, root);
      if (inp) inp.type = inp.type === 'password' ? 'text' : 'password';
    }));

    const form = U.$('#login-form', root);
    form?.addEventListener('submit', async e => {
      e.preventDefault();
      const email = (U.$('#l-email', root)?.value || '').trim();
      const password = U.$('#l-pass', root)?.value || '';
      const submitBtn = U.$('#l-submit', root);

      if (!email || !password) {
        toast('Please enter both email and password', 'error');
        return;
      }

      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.innerHTML = `<span class="spinner" style="display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin 0.6s linear infinite;margin-right:8px"></span> Logging in…`;
      }

      const res = await apiPost('/auth/login', { email, password });
      
      if (submitBtn) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `${icon('logout', 0)} LOGIN`;
      }

      if (res && res.token && res.user) {
        const u = res.user;
        Store.login({ name: u.name || u.fullName, email: u.email, phone: u.phone || '', role: u.role, token: res.token });
        toast('Welcome back, ' + (u.name || 'friend') + '! 🎉', 'success');
        location.hash = window.App.afterLogin(u.role === 'admin' ? '#/admin/overview' : u.role === 'pro' || u.role === 'professional' ? '#/pro/overview' : '#/dashboard/overview');
      } else if (res && (res.error || res.message)) {
        toast(res.error || res.message || 'Email or password is incorrect.', 'error');
      } else {
        // Fallback demo mode if offline
        const role = U.$('input[name="role"]:checked', root)?.value || 'customer';
        Store.login({ name: email.split('@')[0].replace(/[._-]/g, ' ') || 'Customer', role: role === 'professional' ? 'pro' : 'customer', email });
        toast('Welcome back! 🎉', 'success');
        location.hash = window.App.afterLogin(role === 'professional' ? '#/pro/overview' : '#/dashboard/overview');
      }
    });

    U.$('[data-act="demo-login"]', root)?.addEventListener('click', () => {
      const role = U.$('input[name="role"]:checked', root)?.value || 'customer';
      if (role === 'admin') {
        Store.login({ name: 'Servehub Admin', role: 'admin', email: 'admin@servehub.com' });
        toast('Welcome back, Admin!', 'success');
        location.hash = '#/admin/overview';
      } else {
        Store.login({ name: 'Priya Sharma', role: 'customer', email: 'customer@servehub.com' });
        toast('Welcome back, Priya! 🎉', 'success');
        location.hash = window.App.afterLogin('#/dashboard/overview');
      }
    });
  };

  /* ---------------- REGISTER ---------------- */
  const Register = () => authShell('Create your account', 'Join 2.4M+ families who book home services the easy way.',
    `
    <form id="reg-form" novalidate>
      <div class="field"><label class="label">I want to</label>
        <div class="radio-pill">
          <label><input type="radio" name="role" value="customer" checked><span>Customer</span></label>
          <label><input type="radio" name="role" value="professional"><span>Service Provider</span></label>
        </div>
      </div>
      <div class="field"><label class="label" for="r-name">Full Name</label><input class="input" id="r-name" placeholder="Priya Sharma" required></div>
      <div class="grid g2" style="grid-template-columns:1fr 1fr;gap:12px">
        <div class="field"><label class="label" for="r-email">Email Address</label><div class="input-group">${icon('mail', 17)}<input class="input input-icon-r" id="r-email" type="email" placeholder="you@example.com" required></div></div>
        <div class="field"><label class="label" for="r-phone">Phone Number</label><input class="input" id="r-phone" type="tel" placeholder="+91 98765 43210" required></div>
      </div>
      <div class="field"><label class="label" for="r-pass">Password</label><div class="input-group">${icon('lock', 17)}<input class="input input-icon-r" id="r-pass" type="password" placeholder="8+ characters" required>${pwToggle('r-pass')}</div></div>
      
      <!-- Password Strength Meter -->
      <div id="pw-meter-wrap" style="display:none;margin-bottom:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px">
        <div style="display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:6px">
          <span>Password Strength:</span>
          <span id="pw-strength-label" style="color:var(--error-600)">Weak</span>
        </div>
        <div style="height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:8px">
          <div id="pw-strength-bar" style="width:20%;height:100%;background:var(--error-600);transition:all 0.3s"></div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;font-size:11px;color:var(--ink-3)">
          <span id="chk-len">○ 8+ characters</span>
          <span id="chk-upper">○ 1 Uppercase (A-Z)</span>
          <span id="chk-lower">○ 1 Lowercase (a-z)</span>
          <span id="chk-num">○ 1 Number (0-9)</span>
          <span id="chk-spec" style="grid-column:1/-1">○ 1 Special character (@$!%*?&_)</span>
        </div>
      </div>

      <div class="field"><label class="label" for="r-confirm-pass">Confirm Password</label><div class="input-group">${icon('lock', 17)}<input class="input input-icon-r" id="r-confirm-pass" type="password" placeholder="••••••••" required>${pwToggle('r-confirm-pass')}</div></div>

      <button class="btn btn-cta btn-lg btn-block" id="r-submit" type="submit">${icon('arrowRight', 16)} REGISTER</button>
    </form>
    <p class="auth-alt" style="margin-top:16px">Already have an account? <a href="#/login">Log in</a></p>
    <p class="xsmall muted center" style="margin-top:14px">By continuing you agree to our <a href="#/terms" style="color:var(--primary-600)">Terms</a> &amp; <a href="#/privacy" style="color:var(--primary-600)">Privacy Policy</a>.</p>
  `);

  const registerWire = root => {
    U.$$('[data-act="pw-toggle"]', root).forEach(btn => btn.addEventListener('click', () => {
      const inp = U.$('#' + btn.dataset.id, root);
      if (inp) inp.type = inp.type === 'password' ? 'text' : 'password';
    }));

    const passInput = U.$('#r-pass', root);
    const meterWrap = U.$('#pw-meter-wrap', root);
    const bar = U.$('#pw-strength-bar', root);
    const label = U.$('#pw-strength-label', root);

    const updateMeter = () => {
      const val = passInput?.value || '';
      if (!val) { if (meterWrap) meterWrap.style.display = 'none'; return; }
      if (meterWrap) meterWrap.style.display = 'block';

      const checks = {
        len: val.length >= 8,
        upper: /[A-Z]/.test(val),
        lower: /[a-z]/.test(val),
        num: /[0-9]/.test(val),
        spec: /[@$!%*?&_\-#^()]/.test(val),
      };

      const setChk = (id, ok) => {
        const el = U.$('#' + id, root);
        if (!el) return;
        el.style.color = ok ? '#10B981' : 'var(--ink-3)';
        el.textContent = (ok ? '✓ ' : '○ ') + el.textContent.substring(2);
      };

      setChk('chk-len', checks.len);
      setChk('chk-upper', checks.upper);
      setChk('chk-lower', checks.lower);
      setChk('chk-num', checks.num);
      setChk('chk-spec', checks.spec);

      const score = Object.values(checks).filter(Boolean).length;
      const pct = (score / 5) * 100;
      const color = score <= 2 ? '#EF4444' : score <= 4 ? '#F59E0B' : '#10B981';
      const text = score <= 2 ? 'Weak' : score <= 4 ? 'Medium' : 'Strong';

      if (bar) { bar.style.width = pct + '%'; bar.style.background = color; }
      if (label) { label.textContent = `${text} (${score}/5)`; label.style.color = color; }
    };

    passInput?.addEventListener('input', updateMeter);

    const form = U.$('#reg-form', root);

      if (res && res.success) {

    </form>
    <p class="auth-alt"><a href="#/login">← Back to Login</a></p>
  `);

  const forgotWire = root => {

      e.preventDefault();
      const email = (U.$('#f-email', root)?.value || '').trim();
      const btn = U.$('#f-submit', root);

      if (!/^\S+@\S+\.\S+$/.test(email)) {
        toast('Please enter a valid registered email address', 'error');
        return;
      }

      if (btn) { btn.disabled = true; btn.textContent = 'Sending OTP…'; }

      const res = await apiPost('/auth/forgot-password', { email });

      if (btn) { btn.disabled = false; btn.textContent = 'SEND OTP'; }

      sessionStorage.setItem('sh_reset_email', email);

      if (res && res.demoOtp) {
        // SMTP not configured — store OTP to display on next page
        sessionStorage.setItem('sh_demo_otp', res.demoOtp);
        toast(`📧 No SMTP set up — Use OTP shown on the next page to continue`, 'warn');
      } else {
        sessionStorage.removeItem('sh_demo_otp');
        toast('Verification code sent! Check your inbox.', 'success');
      }

      setTimeout(() => { location.hash = '#/verify-otp'; }, 1200);
    });
  };

  /* ---------------- VERIFY OTP ---------------- */
  const VerifyOTP = () => {
    const email = sessionStorage.getItem('sh_reset_email') || 'your email';
    return authShell('Verify Your Email', `We've sent a 6-digit verification code to: <br><b style="color:var(--primary-600)">${esc(email)}</b>`,
      `
      <!-- Demo OTP banner: shown when SMTP email is not configured -->
      <div id="demo-otp-banner" style="display:none;background:#fef9c3;border:1.5px solid #fde047;border-radius:12px;padding:14px 16px;margin-bottom:16px;text-align:center">
        <div style="font-size:11px;font-weight:700;color:#92400e;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px">📧 Email not sent — No SMTP configured</div>
        <div style="font-size:13px;color:#78350f;margin-bottom:8px">Use this verification code to continue:</div>
        <div id="demo-otp-code" style="font-size:32px;font-weight:900;letter-spacing:10px;color:#1e40af;font-family:monospace">------</div>
        <div style="font-size:11px;color:#92400e;margin-top:6px">To receive real emails, add your Gmail App Password to <b>backend/.env</b></div>
      </div>

      <div class="otp-row" style="margin-bottom:16px;display:flex;gap:8px;justify-content:center">
        ${[0, 1, 2, 3, 4, 5].map(i => `<input class="otp" style="width:44px;height:54px;text-align:center;font-size:22px;font-weight:800;border-radius:12px;border:1px solid var(--line)" inputmode="numeric" maxlength="1" data-vo="${i}" aria-label="Digit ${i + 1}">`).join('')}
      </div>

      <div class="center" style="margin-bottom:20px;font-size:13.5px;color:var(--ink-3)">
        Code expires in: <b id="vo-expiry" style="color:var(--primary-600)">5:00</b>
      </div>

      <button class="btn btn-primary btn-lg btn-block" id="vo-submit" disabled>${icon('checkCircle', 16)} VERIFY OTP</button>
      
      <p class="small muted center" style="margin-top:16px">
        Didn't receive the code? <a href="#" id="vo-resend" style="color:var(--primary-600);font-weight:700">Resend OTP (<span id="vo-cooldown">60</span>s)</a>
      </p>
      <p class="auth-alt"><a href="#/login">← Back to Login</a></p>
    `);
  };

  const verifyOTPWire = root => {
    const email = sessionStorage.getItem('sh_reset_email') || '';
    const inputs = U.$$('[data-vo]', root);
    const submitBtn = U.$('#vo-submit', root);
    const expiryEl = U.$('#vo-expiry', root);
    const cooldownEl = U.$('#vo-cooldown', root);
    const resendBtn = U.$('#vo-resend', root);
    const demoBanner = U.$('#demo-otp-banner', root);
    const demoCodeEl = U.$('#demo-otp-code', root);

    // Show demo OTP banner if no SMTP configured
    const showDemoOtp = (otp) => {
      if (!otp || !demoBanner) return;
      if (demoCodeEl) demoCodeEl.textContent = otp;
      demoBanner.style.display = 'block';
      sessionStorage.setItem('sh_demo_otp', otp);
    };

    const storedDemoOtp = sessionStorage.getItem('sh_demo_otp');
    if (storedDemoOtp) showDemoOtp(storedDemoOtp);

    const update = () => {
      const full = inputs.map(i => i.value).join('');
      if (submitBtn) submitBtn.disabled = full.length < 6;
    };

    inputs.forEach((inp, i) => {
      inp.addEventListener('input', e => {
        inp.value = inp.value.replace(/\D/g, '');
        if (inp.value && i < 5) inputs[i + 1].focus();
        update();
      });
      inp.addEventListener('keydown', e => {
        if (e.key === 'Backspace' && !inp.value && i > 0) inputs[i - 1].focus();
      });
      inp.addEventListener('paste', e => {
        const digits = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 6);
        digits.split('').forEach((d, j) => { if (inputs[j]) inputs[j].value = d; });
        if (digits.length === 6 && inputs[5]) inputs[5].focus();
        update();
      });
    });

    // 5-minute countdown timer (300s)
    let expSecs = 300;
    const expIv = setInterval(() => {
      expSecs--;
      const m = Math.floor(expSecs / 60);
      const s = expSecs % 60;
      if (expiryEl) expiryEl.textContent = `${m}:${s < 10 ? '0' : ''}${s}`;
      if (expSecs <= 0) {
        clearInterval(expIv);
        if (expiryEl) expiryEl.innerHTML = `<span style="color:var(--error-600);font-weight:700">Expired</span>`;
        if (submitBtn) submitBtn.disabled = true;
      }
    }, 1000);

    // 60-second resend cooldown
    let coolSecs = 60;
    const coolIv = setInterval(() => {
      coolSecs--;
      if (cooldownEl) cooldownEl.textContent = Math.max(coolSecs, 0);
      if (coolSecs <= 0) {
        clearInterval(coolIv);
        if (resendBtn) resendBtn.textContent = 'RESEND OTP NOW';
      }
    }, 1000);

    resendBtn?.addEventListener('click', async e => {
      e.preventDefault();
      if (coolSecs > 0) return;
      toast('Sending new verification code…', 'info');
      const res = await apiPost('/auth/resend-otp', { email });
      if (res && res.success) {
        if (res.demoOtp) {
          showDemoOtp(res.demoOtp);
          toast('New OTP generated — see the yellow box above', 'warn');
        } else {
          toast('New OTP sent to your inbox 📩', 'success');
          if (demoBanner) demoBanner.style.display = 'none';
        }
        expSecs = 300; coolSecs = 60;
        if (resendBtn) resendBtn.innerHTML = `Resend OTP (<span id="vo-cooldown">60</span>s)`;
        inputs.forEach(i => i.value = '');
      } else {
        toast(res?.error || 'Unable to resend OTP', 'error');
      }
    });

    submitBtn?.addEventListener('click', async () => {
      const otp = inputs.map(i => i.value).join('');
      if (otp.length < 6) return toast('Please enter all 6 digits', 'warn');
      if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = 'Verifying…'; }

      const res = await apiPost('/auth/verify-otp', { email, otp });

      if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = 'VERIFY OTP'; }

      if (res && res.success && res.resetToken) {
        sessionStorage.setItem('sh_reset_token', res.resetToken);
        toast('OTP verified successfully! Redirecting…', 'success');
        setTimeout(() => { location.hash = '#/reset-password'; }, 800);
      } else if (res && (res.error || res.message)) {
        toast(res.error || res.message || 'The verification code is incorrect.', 'error');
      } else {
        // Fallback demo mode
        sessionStorage.setItem('sh_reset_token', 'demo_reset_token');
        toast('OTP verified! 🎉', 'success');
        setTimeout(() => { location.hash = '#/reset-password'; }, 800);
      }
    });
  };

  /* ---------------- RESET PASSWORD ---------------- */
  const ResetPassword = () => authShell('Reset Your Password', 'Create a new password for your ServeHub account.',
    `
    <form id="reset-form" novalidate>
      <div class="field"><label class="label" for="rp-pass">New Password</label>
        <div class="input-group">${icon('lock', 17)}<input class="input input-icon-r" id="rp-pass" type="password" placeholder="••••••••" required>${pwToggle('rp-pass')}</div>
      </div>

      <div id="rp-meter-wrap" style="display:none;margin-bottom:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px">
        <div style="height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:8px">
          <div id="rp-strength-bar" style="width:20%;height:100%;background:var(--error-600);transition:all 0.3s"></div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;font-size:11px;color:var(--ink-3)">
          <span id="rp-chk-len">○ 8+ characters</span>
          <span id="rp-chk-upper">○ 1 Uppercase</span>
          <span id="rp-chk-lower">○ 1 Lowercase</span>
          <span id="rp-chk-num">○ 1 Number</span>
          <span id="rp-chk-spec" style="grid-column:1/-1">○ 1 Special character</span>
        </div>
      </div>

      <div class="field"><label class="label" for="rp-confirm-pass">Confirm Password</label>
        <div class="input-group">${icon('lock', 17)}<input class="input input-icon-r" id="rp-confirm-pass" type="password" placeholder="••••••••" required>${pwToggle('rp-confirm-pass')}</div>
      </div>

      <button class="btn btn-primary btn-lg btn-block" id="rp-submit" type="submit">${icon('checkCircle', 16)} RESET PASSWORD</button>
    </form>
    <p class="auth-alt"><a href="#/login">← Back to Login</a></p>
  `);

  const resetPasswordWire = root => {
    U.$$('[data-act="pw-toggle"]', root).forEach(btn => btn.addEventListener('click', () => {
      const inp = U.$('#' + btn.dataset.id, root);
      if (inp) inp.type = inp.type === 'password' ? 'text' : 'password';
    }));

    const passInput = U.$('#rp-pass', root);
    const meterWrap = U.$('#rp-meter-wrap', root);
    const bar = U.$('#rp-strength-bar', root);

    passInput?.addEventListener('input', () => {
      const val = passInput?.value || '';
      if (!val) { if (meterWrap) meterWrap.style.display = 'none'; return; }
      if (meterWrap) meterWrap.style.display = 'block';

      const checks = {
        len: val.length >= 8,
        upper: /[A-Z]/.test(val),
        lower: /[a-z]/.test(val),
        num: /[0-9]/.test(val),
        spec: /[@$!%*?&_\-#^()]/.test(val),
      };

      const setChk = (id, ok) => {
        const el = U.$('#' + id, root);
        if (!el) return;
        el.style.color = ok ? '#10B981' : 'var(--ink-3)';
        el.textContent = (ok ? '✓ ' : '○ ') + el.textContent.substring(2);
      };

      setChk('rp-chk-len', checks.len);
      setChk('rp-chk-upper', checks.upper);
      setChk('rp-chk-lower', checks.lower);
      setChk('rp-chk-num', checks.num);
      setChk('rp-chk-spec', checks.spec);

      const score = Object.values(checks).filter(Boolean).length;
      if (bar) {
        bar.style.width = (score / 5 * 100) + '%';
        bar.style.background = score <= 2 ? '#EF4444' : score <= 4 ? '#F59E0B' : '#10B981';
      }
    });

    const form = U.$('#reset-form', root);
    form?.addEventListener('submit', async e => {
      e.preventDefault();
      const resetToken = sessionStorage.getItem('sh_reset_token');
      const newPassword = U.$('#rp-pass', root)?.value || '';
      const confirmPassword = U.$('#rp-confirm-pass', root)?.value || '';
      const btn = U.$('#rp-submit', root);

      if (!newPassword || newPassword.length < 8) return toast('Password must be at least 8 characters long', 'error');
      if (newPassword !== confirmPassword) return toast('Passwords do not match', 'error');

      if (btn) { btn.disabled = true; btn.textContent = 'Resetting Password…'; }

      const res = await apiPost('/auth/reset-password', {
        resetToken, newPassword, confirmPassword
      });

      if (btn) { btn.disabled = false; btn.textContent = 'RESET PASSWORD'; }

      if (res && res.success) {
        toast('Your password has been reset successfully. You can now log in.', 'success');
        sessionStorage.removeItem('sh_reset_token');
        sessionStorage.removeItem('sh_reset_email');
        setTimeout(() => { location.hash = '#/login'; }, 1500);
      } else if (res && (res.error || res.message)) {
        toast(res.error || res.message, 'error');
      } else {
        toast('Your password has been reset successfully.', 'success');
        setTimeout(() => { location.hash = '#/login'; }, 1500);
      }
    });
  };

  /* ---------------- PRO ONBOARDING & MARKETING ---------------- */
  const ProOnboarding = () => {
    const p = JSON.parse(sessionStorage.getItem('sh:pending') || '{}');
    const steps = ['Profile', 'Documents', 'Certificates', 'Bank & KYC', 'Review'];
    const upload = (id, label, hint) => `
      <div class="field"><label class="label">${label}</label>
        <label class="upload-zone" for="${id}"><div class="u-ic">${icon('upload', 22)}</div><b style="font-size:14px">Tap to upload ${hint}</b><div class="xsmall muted" style="margin-top:4px">PNG / JPG / PDF, max 5MB</div><input type="file" id="${id}" accept="image/*,.pdf" style="display:none"></label>
        <div id="${id}-prev" style="display:none;margin-top:8px;gap:8px;flex-wrap:wrap;align-items:center" class="small"></div>
      </div>`;
    return authShell('Become a Servehub professional', 'Complete these 5 steps to start earning. Most applications are approved within 48 hours.',
      `
      ${U.stepper(steps, 0)}
      <div style="background:var(--primary-50);border:1px solid var(--primary-100);border-radius:14px;padding:14px 16px;margin-bottom:20px;display:flex;gap:10px;font-size:13px">
        ${icon('info', 17)} We verify every document for your safety and for the safety of our customers.
      </div>
      <form id="pro-form" novalidate>
        <div class="field"><label class="label" for="po-name">Full name</label><input class="input" id="po-name" value="${esc(p.name || '')}" required></div>
        <div class="grid g2" style="grid-template-columns:1fr 1fr;gap:12px">
          <div class="field"><label class="label" for="po-phone">Mobile</label><input class="input" id="po-phone" value="${esc(p.phone || '')}"></div>
          <div class="field"><label class="label" for="po-city">Service city</label><select class="select" id="po-city">${DATA.cities.map(c => `<option>${c.name}</option>`).join('')}</select></div>
        </div>
        <div class="field"><label class="label" for="po-cat">Service category</label><select class="select" id="po-cat">${DATA.categories.map(c => `<option>${c.name}</option>`).join('')}</select></div>
        <div class="field"><label class="label" for="po-exp">Years of experience</label><input class="input" id="po-exp" type="number" min="0" placeholder="e.g. 5"></div>
        ${upload('po-aadhaar', 'Government ID (Aadhaar / Passport / Driving License)', 'your ID')}
        ${upload('po-selfie', 'Selfie with your ID', 'a selfie')}
        ${upload('po-cert', 'Skill certificates (ITI / diploma / training)', 'certificates')}
        <div class="field"><label class="label" for="po-acc">Bank account number</label><input class="input" id="po-acc" placeholder="Enter account number"></div>
        <div class="field"><label class="label" for="po-ifsc">IFSC code</label><input class="input" id="po-ifsc" placeholder="e.g. HDFC0001234"></div>
        <div class="field"><label class="label" for="po-pan">PAN number</label><input class="input" id="po-pan" placeholder="ABCDE1234F"></div>
        <button class="btn btn-cta btn-lg btn-block" type="submit">${icon('rocket', 17)} Submit application</button>
        <p class="xsmall muted center" style="margin-top:12px">Documents are encrypted and only used for verification.</p>
      </form>
    `);
  };

  const proOnboardWire = root => {
    U.$$('.upload-zone input[type=file]', root).forEach(inp => inp.addEventListener('change', async () => {
      const f = inp.files[0]; if (!f) return;
      const prev = U.$('#' + inp.id + '-prev');
      prev.style.display = 'flex';
      const isImg = f.type.startsWith('image/');
      prev.innerHTML = isImg ? `<img src="${await fileToDataURL(f)}" style="width:56px;height:56px;border-radius:12px;object-fit:cover;border:1px solid var(--line)"><span>${esc(f.name)} <b style="color:var(--success-600)">✓ uploaded</b></span>` : `${icon('file', 16)} <span>${esc(f.name)} <b style="color:var(--success-600)">✓ uploaded</b></span>`;
      toast('File uploaded', 'success');
    }));
    U.$('#pro-form')?.addEventListener('submit', e => {
      e.preventDefault();
      const p = JSON.parse(sessionStorage.getItem('sh:pending') || '{}');
      const app = {
        id: 'AP' + Math.floor(1000 + Math.random() * 9000), name: U.$('#po-name').value || p.name,
        phone: U.$('#po-phone').value || p.phone, email: p.email, city: U.$('#po-city').value,
        cat: U.$('#po-cat').value, exp: U.$('#po-exp').value || '3', status: 'pending', createdAt: Date.now(),
      };
      Store.state.proApps.unshift(app); Store.persist();
      Store.login({ name: app.name, role: 'pro', email: p.email, appId: app.id });
      Store.addNotif('briefcase', 'Application submitted 🎉', `Your Servehub professional application ${app.id} is under review. We will notify you within 48 hours.`);
      sessionStorage.removeItem('sh:pending');
      toast('Application submitted! We review it within 48 hours ⏳', 'success');
      location.hash = '#/pro/overview';
    });
  };

  const BecomePro = () => `
    <section class="page-hero"><div class="container">
      <div class="crumbs"><a href="">Home</a><span>/</span><span>For professionals</span></div>
      <span class="kicker">${icon('rocket', 13)}Servehub for Professionals</span>
      <h1 class="h2" style="font-size:clamp(28px,4.4vw,44px);max-width:700px">Turn your skills into a <span class="grad-text">steady income.</span></h1>
      <p class="lead" style="margin-top:12px">Join 12,000+ verified professionals. Set your own hours, earn up to ₹45,000 a month, and grow with free training.</p>
      <div style="display:flex;gap:12px;margin-top:26px;flex-wrap:wrap">
        <a class="btn btn-cta btn-lg" href="#/register">${icon('rocket', 18)} Apply now — it's free</a>
        <button class="btn btn-outline btn-lg" data-act="toast" data-msg="Earnings calculator opened 📊">${icon('barChart', 17)} Estimate your earnings</button>
      </div>
    </div></section>
    <section class="section"><div class="container">
      <div class="grid g4" style="margin-bottom:48px">
        ${[['wallet', '₹30–45k', 'Average monthly earnings'], ['calendar', 'Own schedule', 'Work hours that suit you'], ['graduation', 'Free training', 'Upgrade skills, earn more'], ['shield', 'Insurance', 'On-job coverage included']].map(s => `<div class="card why-card reveal" data-reveal><div class="w-ic" style="background:var(--grad)">${icon(s[0], 22)}</div><h3 style="font-size:19px">${s[1]}</h3><p class="small">${s[2]}</p></div>`).join('')}
      </div>
      <div class="grid g2" style="grid-template-columns:1fr 1fr;gap:40px;align-items:center">
        <div>
          <h2 class="h3" style="margin-bottom:16px">How onboarding works</h2>
          ${[['1', 'Apply & verify', 'Submit your ID, certificates and bank details — takes ~10 minutes.'], ['2', 'Quick skill check', 'A short practical or video assessment confirms your expertise.'], ['3', 'Get approved & earn', 'Approved within 48 hours. Start accepting bookings and earning instantly.']].map((s, i) => `
            <div style="display:flex;gap:16px;margin-bottom:20px"><span class="s-dot" style="width:38px;height:38px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:800;flex:none">${s[0]}</span><div><b>${s[1]}</b><p class="small muted" style="margin-top:3px">${s[2]}</p></div></div>`).join('')}
          <a class="btn btn-cta btn-lg" href="#/register">Start my application</a>
        </div>
        <div class="card glass" style="padding:26px">
          <div class="badge badge-success" style="margin-bottom:14px">${icon('trendingUp', 12)} Weekly earnings — this pro</div>
          ${U.barChart([3200, 4100, 3800, 5200, 4700, 6100, 5800, 7200, 6600, 8400, 7900, 9600], ['M', 'T', 'W', 'T', 'F', 'S', 'S', 'M', 'T', 'W', 'T', 'F'])}
          <div class="small muted" style="margin-top:12px">Rahul S., AC & Appliance Expert, Mumbai — 96 jobs in 90 days</div>
        </div>
      </div>
    </div></section>`;

  const render = (name, params) => {
    const map = {
      login: { html: Login, wire: loginWire },
      register: { html: Register, wire: registerWire },
      forgot: { html: Forgot, wire: forgotWire },
      'verify-otp': { html: VerifyOTP, wire: verifyOTPWire },
      'forgot-otp': { html: VerifyOTP, wire: verifyOTPWire },
      'reset-password': { html: ResetPassword, wire: resetPasswordWire },
      'pro-onboarding': { html: ProOnboarding, wire: proOnboardWire },
      'become-pro': { html: BecomePro, wire: null },
    };
    const r = map[name];
    return r ? { html: r.html(params), wire: r.wire } : null;
  };

  return { render, doLogin: (role, email) => { Store.login({ name: email.split('@')[0], role }); location.hash = window.App.afterLogin('#/dashboard/overview'); } };
})();

</script>

    const gst = Math.round(sub * 0.18);
    const disc = bk.disc || 0;
    const total = sub + gst - disc + (bk.emergency ? 99 : 0);
    const today = new Date();

    const dateOpts = Array.from({ length: 14 }, (_, i) => {

      return { ts: d.getTime(), day: d.toLocaleDateString('en-IN', { day: '2-digit' }), mon: d.toLocaleDateString('en-IN', { month: 'short' }), wd: d.toLocaleDateString('en-IN', { weekday: 'short' }) };
    });
    const slots = ['09:00 AM', '10:30 AM', '12:00 PM', '01:30 PM', '03:00 PM', '04:30 PM', '06:00 PM', '07:30 PM'];
    const pros = DATA.prosForService(s);

      `<div style="margin-bottom:20px"><h3 style="font-size:18px">Choose your package</h3><p class="small muted">Every package includes the full service + 100% warranty + GST invoice.</p></div>
       ${packs.map((p, i) => `<div class="pack-row ${bk.pack === i ? 'on' : ''}" data-pack="${i}" tabindex="0" role="radio" aria-checked="${bk.pack === i}"><div><div class="pk-name">${p.name} <span class="badge ${i === 1 ? 'badge-success' : i === 2 ? 'badge-warn' : 'badge-primary'}">${i === 1 ? 'Best value' : i === 2 ? 'Urgent' : 'Popular'}</span></div><div class="pk-desc">${p.desc} • ${p.dur}</div></div><div class="pk-price">${money(p.price)}</div></div>`).join('')}`,
      /* 1 date & time */
      `<div style="margin-bottom:20px"><h3 style="font-size:18px">Pick a date</h3><p class="small muted">Earliest available: today, 09:00 AM</p></div>
       <div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:20px">
         ${dateOpts.map((d, i) => `<button class="f-chip ${bk.date === d.ts ? 'on' : ''}" data-date="${d.ts}" style="flex:none;flex-direction:column;gap:2px;padding:10px 14px;line-height:1.2"><b style="font-size:13px">${i === 0 ? 'Today' : d.wd}</b><span>${d.day} ${d.mon}</span></button>`).join('')}
       </div>
       <h3 style="font-size:16px;margin-bottom:12px">Available time slots</h3>
       <div class="radio-pill" style="margin-bottom:20px">${slots.map(t => `<label><input type="radio" name="slot" value="${t}" ${bk.time === t ? 'checked' : ''}><span>${t}</span></label>`).join('')}</div>
       <div class="grid g2" style="grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px">
         <label class="pack-row" style="cursor:pointer"><input type="checkbox" id="bk-instant" ${bk.instant ? 'checked' : ''} style="display:none"><span>${icon('zap', 16)} <span><b>Instant booking</b><br><span class="pk-desc">Nearest expert, earliest slot</span></span></span></label>
         <label class="pack-row" style="cursor:pointer"><input type="checkbox" id="bk-emergency" ${bk.emergency ? 'checked' : ''} style="display:none"><span>${icon('rocket', 16)} <span><b>Emergency +₹99</b><br><span class="pk-desc">Priority dispatch, ~60 min</span></span></span></label>
       </div>`,
      /* 2 address */
      `<div style="margin-bottom:20px"><h3 style="font-size:18px">Where should we come?</h3><p class="small muted">We use your address for booking & live tracking.</p></div>
       <div style="margin-bottom:16px;background:var(--surface-2);padding:14px;border-radius:14px;border:1px dashed var(--line)">
         <button type="button" class="btn btn-soft btn-block" id="bk-detect-loc" style="display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;font-weight:600">
           ${icon('navigation', 16)} Use current device location
         </button>
         <div id="bk-loc-status" class="small center" style="margin-top:6px"></div>
       </div>
       ${Store.state.addr.map(a => `<div class="pack-row ${bk.addr === a.id ? 'on' : ''}" data-addr="${a.id}" tabindex="0"><div><div class="pk-name">${icon('pin', 14)} ${esc(a.label)} ${a.primary ? '<span class="badge badge-primary">Default</span>' : ''}</div><div class="pk-desc">${esc(a.line)}, ${esc(a.area)}, ${esc(a.city)} — ${a.pin}</div></div><span class="verified">${icon('badgeCheck', 11)} Verified</span></div>`).join('')}
       <button class="btn btn-outline btn-block" data-act="add-addr">${icon('plus', 15)} Add new address</button>`,
      /* 3 professional */
      `<div style="margin-bottom:20px"><h3 style="font-size:18px">Choose your professional</h3><p class="small muted">All experts are verified, rated and background-checked.</p></div>
       <label class="pack-row ${bk.autoPro ? 'on' : ''}" data-pro="auto" tabindex="0" style="background:var(--grad-soft);border-color:var(--primary-100)"><div><div class="pk-name">${icon('sparkles', 15)} Auto-assign best professional</div><div class="pk-desc">We pick the highest-rated available expert near you</div></div><span class="verified">${icon('badgeCheck', 11)} Recommended</span></label>
       ${pros.map(p => `<div class="pack-row ${!bk.autoPro && bk.pro === p.id ? 'on' : ''}" data-pro="${p.id}" tabindex="0">
         <div style="display:flex;gap:12px;align-items:center">${avatar(p.name, 44)}<div><div class="pk-name">${esc(p.name)} ${p.verified ? icon('badgeCheck', 13) : ''}</div><div class="pk-desc">${ratingPillSmall(p.rating)} ${p.jobs.toLocaleString('en-IN')} jobs • ${p.exp} yrs • ${p.dist} km away</div></div></div>
         <div class="pk-price" style="font-size:14px">${money(p.rate)}<span class="xsmall muted" style="font-weight:500">/hr</span></div>
       </div>`).join('')}`,
      /* 4 payment */
      `<div style="margin-bottom:20px"><h3 style="font-size:18px">Secure payment</h3><p class="small muted">256-bit encrypted • PCI-DSS compliant • GST invoice on completion</p></div>
       <div class="field"><label class="label" for="bk-coupon">Promo code</label><div style="display:flex;gap:8px"><input class="input" id="bk-coupon" placeholder="e.g. SERVE10" value="${bk.coupon || ''}"><button class="btn btn-soft" id="bk-apply-coupon">Apply</button></div>
       <div id="coupon-msg" class="small"></div></div>
       <div style="margin:6px 0 14px">${[['upi', 'UPI', 'Google Pay, PhonePe, Paytm', 'smartphone'], ['card', 'Credit / Debit Card', 'Visa, Mastercard, RuPay, Amex', 'card'], ['net', 'Net Banking', 'All major banks', 'bank'], ['wallet', 'Servehub Wallet', `Balance: ${money(walletBal)}`, 'wallet'], ['cash', 'Cash', 'Pay the professional directly', 'cash'], ['emi', 'EMI', 'No-cost EMI on 3/6/9 months', 'percent']].map(m => `
         <div class="pay-method ${bk.payMethod === m[0] ? 'on' : ''}" data-pay="${m[0]}"><span class="pm-ic" style="background:var(--primary-50);color:var(--primary-600)">${icon(m[3], 19)}</span><div class="pm-info"><div class="pm-name">${m[1]}</div><div class="pm-sub">${m[2]}</div></div><span class="ic" style="color:var(--primary)">${bk.payMethod === m[0] ? icon('checkCircle', 18) : ''}</span></div>`).join('')}
       </div>
       <div id="pay-detail"></div>
       <div class="field"><label class="label" for="bk-notes">Notes for the professional (optional)</label><textarea class="textarea" id="bk-notes" style="min-height:70px" placeholder="e.g. please carry a ladder, parking is available">${bk.notes || ''}</textarea></div>`,
      /* 5 confirm */
      `<div style="text-align:center;padding:14px 0 6px"><div class="e-ic" style="width:88px;height:88px;border-radius:26px;background:var(--success-50);color:var(--success);display:grid;place-items:center;margin:0 auto 18px;box-shadow:0 0 0 10px var(--success-50)">${icon('checkCircle', 44)}</div>
       <h3 style="font-size:22px">Almost there!</h3><p class="small muted" style="margin:8px 0 22px">Review your booking details one last time — then confirm to lock in your slot.</p></div>
       <div class="card glass" style="padding:20px;margin-bottom:16px">
         <div class="sum-row"><span class="muted">Service</span><b>${esc(s.name)}</b></div>
         <div class="sum-row"><span class="muted">Package</span><b>${P.name} • ${P.dur}</b></div>
         <div class="sum-row"><span class="muted">Slot</span><b>${bk.date ? fmtDate(bk.date) : 'Today'} at ${bk.time || 'Earliest'}</b></div>
         <div class="sum-row"><span class="muted">Professional</span><b>${bk.autoPro ? 'Auto-assigned' : esc((pros.find(p => p.id === bk.pro) || {}).name || '')}</b></div>
         <div class="sum-row"><span class="muted">Address</span><b style="max-width:220px;text-align:right">${esc((Store.state.addr.find(a => a.id === bk.addr) || {}).label || 'Add at booking')}</b></div>
         ${bk.emergency ? '<div class="sum-row"><span class="muted">Emergency dispatch</span><b>+₹99</b></div>' : ''}
       </div>
       <p class="xsmall muted center">By confirming you agree to Servehub's Terms, Cancellation &amp; Refund Policy.</p>`,
    ][bk.step];

    return `
    <section class="section" style="padding-top:calc(var(--nav-h) + 28px)">
      <div class="container" style="max-width:960px">
        <div class="crumbs"><a href="">Home</a><span>/</span><a href="#/service/${s.id}">${esc(s.name)}</a><span>/</span><span>Book</span></div>
        ${U.stepper(steps, bk.step)}
        <div class="grid" style="grid-template-columns:1.5fr 1fr;gap:28px;align-items:start">
          <div class="card" style="padding:28px" id="bk-step">${stepBody}</div>
          <aside class="summary-card">
            <div class="card" style="padding:24px">
              <div class="svc-art" style="height:100px;border-radius:12px;margin-bottom:16px;overflow:hidden;position:relative;background:var(--surface-2)">
                ${s.img ? `<img src="${s.img}" alt="${esc(s.name)}" style="width:100%;height:100%;object-fit:cover" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">` : ''}
                <div class="art-bg" style="background:${s.g};${s.img ? 'display:none' : ''}">${icon(s.icon, 36)}</div>
              </div>
              <b style="font-size:15px">${esc(s.name)}</b>
              <div class="small muted" style="margin-bottom:12px">${esc(cat.name)} • ${esc(s.dur)}</div>
              <div class="sum-row"><span>Package</span><b>${P.name} ${money(P.price)}</b></div>
              <div class="sum-row"><span>GST (18%)</span><b>${money(gst)}</b></div>
              ${disc ? `<div class="sum-row" style="color:var(--success-600)"><span>Coupon ${esc(bk.coupon || '')}</span><b>−${money(disc)}</b></div>` : ''}
              ${bk.emergency ? '<div class="sum-row"><span>Emergency</span><b>+₹99</b></div>' : ''}
              <div class="sum-total"><span>Total</span><span class="grad-text">${money(total)}</span></div>
              <div style="display:flex;gap:10px;margin-top:20px">
                ${bk.step > 0 ? `<button class="btn btn-outline" id="bk-back" style="flex:1">${icon('arrowLeft', 15)} Back</button>` : `<a class="btn btn-outline" href="#/service/${s.id}" style="flex:1">${icon('arrowLeft', 15)} Cancel</a>`}
                <button class="btn btn-cta" id="bk-next" style="flex:1.6">${bk.step === 5 ? icon('check', 16) + ' Confirm & Pay' : 'Continue ' + icon('arrowRight', 15)}</button>
              </div>
              <div class="small muted center" style="margin-top:14px">${icon('lock', 12)} Free cancellation up to 24h before</div>
            </div>
          </aside>
        </div>
      </div>
    </section>`;
  };

  const ratingPillSmall = r => `<span class="rating">${icon('star')}${r}</span>`;

  const payDetailHtml = () => {
    if (bk.payMethod === 'upi') return `<div class="field"><label class="label" for="pd-upi">Enter your UPI ID</label><div class="input-group">${icon('smartphone', 17)}<input class="input input-icon-r" id="pd-upi" placeholder="yourname@upi"></div></div><div class="field"><label class="label">Choose UPI app</label><div class="radio-pill">${['Google Pay', 'PhonePe', 'Paytm', 'BHIM'].map((a, i) => `<label><input type="radio" name="upiapp" ${i === 0 ? 'checked' : ''}><span>${a}</span></label>`).join('')}</div></div>`;
    if (bk.payMethod === 'card') return `
      <div class="field"><label class="label" for="pd-card">Card number</label><div class="input-group">${icon('card', 17)}<input class="input input-icon-r" id="pd-card" placeholder="1234 5678 9012 3456" maxlength="19" inputmode="numeric"></div></div>
      <div class="grid g2" style="grid-template-columns:1fr 1fr;gap:12px">
        <div class="field"><label class="label" for="pd-exp">Expiry</label><input class="input" id="pd-exp" placeholder="MM/YY" maxlength="5"></div>
        <div class="field"><label class="label" for="pd-cvv">CVV</label><div class="input-group">${icon('lock', 15)}<input class="input input-icon-r" id="pd-cvv" type="password" placeholder="•••" maxlength="4"></div></div>
      </div>`;
    if (bk.payMethod === 'net') return `<div class="field"><label class="label" for="pd-bank">Select your bank</label><select class="select" id="pd-bank"><option>HDFC Bank</option><option>ICICI Bank</option><option>SBI</option><option>Axis Bank</option><option>Kotak Mahindra</option></select></div>`;
    if (bk.payMethod === 'wallet') {
      const bal = Store.state.wallet;
      return `<div class="card glass" style="padding:16px;display:flex;justify-content:space-between;align-items:center"><div><b>Wallet balance</b><div style="font-size:20px;font-weight:900;color:var(--success-600)">${money(bal)}</div></div>${bal >= total() ? `<span class="badge badge-success">${icon('check', 12)} Sufficient</span>` : `<span class="badge badge-warn">Pay ₹${money(total() - bal)} via card</span>`}</div>`;
    }
    if (bk.payMethod === 'emi') return `<div class="field"><label class="label" for="pd-emi">Choose EMI plan</label><select class="select" id="pd-emi"><option>3 months — no-cost</option><option>6 months — 0% interest</option><option>9 months — ₹${Math.ceil(total() * 0.117)}/mo</option></select></div>`;
    return `<div class="card glass" style="padding:16px"><b>${icon('cash', 16)} Pay the professional directly</b><p class="small muted" style="margin-top:4px">Keep exact change ready. You will receive a GST invoice instantly after payment.</p></div>`;
  };
  const total = () => {
    const s = DATA.serviceById(bk.serviceId);
    const P = packsOf(s)[bk.pack];
    return P.price + Math.round(P.price * 0.18) - (bk.disc || 0) + (bk.emergency ? 99 : 0);
  };

  const BookWire = root => {
    const renderPay = () => { const el = U.$('#pay-detail', root); if (el) el.innerHTML = payDetailHtml(); };
    renderPay();
    U.$('#pd-card')?.addEventListener('input', e => { e.target.value = e.target.value.replace(/\D/g, '').replace(/(\d{4})(?=\d)/g, '$1 '); });
    U.$('#pd-exp')?.addEventListener('input', e => { let v = e.target.value.replace(/\D/g, '').slice(0, 4); if (v.length > 2) v = v.slice(0, 2) + '/' + v.slice(2); e.target.value = v; });

    const setStep = n => { bk.step = n; saveBk(); window.App && App.refresh(); };

    U.$$('[data-pack]', root).forEach(el => el.addEventListener('click', () => { bk.pack = Number(el.dataset.pack); saveBk(); setStep(bk.step); }));
    U.$$('[data-date]', root).forEach(el => el.addEventListener('click', () => { bk.date = Number(el.dataset.date); saveBk(); U.$$('[data-date]', root).forEach(b => b.classList.toggle('on', b === el)); }));
    U.$$('input[name="slot"]', root).forEach(el => el.addEventListener('change', () => { bk.time = el.value; saveBk(); }));
    U.$('#bk-instant')?.addEventListener('change', e => { bk.instant = e.target.checked; saveBk(); });
    U.$('#bk-emergency')?.addEventListener('change', e => { bk.emergency = e.target.checked; saveBk(); });
    U.$$('[data-addr]', root).forEach(el => el.addEventListener('click', () => { bk.addr = el.dataset.addr; saveBk(); U.$$('[data-addr]', root).forEach(b => b.classList.toggle('on', b === el)); }));
    U.$$('[data-pro]', root).forEach(el => el.addEventListener('click', () => { if (el.dataset.pro === 'auto') { bk.autoPro = true; bk.pro = null; } else { bk.autoPro = false; bk.pro = el.dataset.pro; } saveBk(); U.$$('[data-pro]', root).forEach(b => b.classList.toggle('on', b === el)); }));
    U.$$('[data-pay]', root).forEach(el => el.addEventListener('click', () => { bk.payMethod = el.dataset.pay; saveBk(); U.$$('[data-pay]', root).forEach(b => { b.classList.toggle('on', b === el); b.querySelector('.ic').innerHTML = b === el ? icon('checkCircle', 18) : ''; }); renderPay(); }));

    const applyCoupon = () => {
      const code = (U.$('#bk-coupon')?.value || '').trim();
      const s = DATA.serviceById(bk.serviceId);
      const sub = packsOf(s)[bk.pack].price;
      const r = Store.applyCoupon(code, sub);
      const msg = U.$('#coupon-msg');
      if (r.ok) { bk.coupon = code; bk.disc = r.disc; saveBk(); msg.innerHTML = `<b style="color:var(--success-600)">${icon('checkCircle', 13)} ${esc(code.toUpperCase())} applied — you save ${money(r.disc)}!</b>`; toast('Coupon applied 🎉'); setStep(bk.step); }
      else { msg.innerHTML = `<b style="color:var(--danger-600)">${esc(r.msg)}</b>`; }
    };
    U.$('#bk-apply-coupon')?.addEventListener('click', applyCoupon);
    U.$('#bk-coupon')?.addEventListener('keydown', e => { if (e.key === 'Enter') applyCoupon(); });

    U.$('#bk-next').addEventListener('click', () => {
      const s = DATA.serviceById(bk.serviceId);
      if (bk.step === 1 && !bk.date) { toast('Please pick a date first', 'warn'); return; }
      if (bk.step === 1 && !bk.time) { toast('Please pick a time slot', 'warn'); return; }
      if (bk.step === 2 && !bk.addr) { toast('Please select or add an address', 'warn'); return; }
      if (bk.step === 4) {
        // pay
        const btn = U.$('#bk-next'); btn.disabled = true; btn.innerHTML = `${icon('timer', 16)} Processing payment…`;
        setTimeout(() => {
          const pro = bk.autoPro ? (DATA.prosForService(s)[0] || Store.demoPro()) : (DATA.proById(bk.pro) || DATA.prosForService(s)[0]);
          const P = packsOf(s)[bk.pack];
          const addr = Store.state.addr.find(a => a.id === bk.addr);
          const b = Store.addBooking({
            serviceId: s.id, serviceName: s.name, cat: s.cat, pack: P.name, packPrice: P.price, dur: P.dur,
            date: bk.date || Date.now(), time: bk.time, instant: bk.instant, emergency: bk.emergency,
            address: addr ? addr.line + ', ' + addr.area + ', ' + addr.city : 'Address on booking',
            proId: pro.id, proName: pro.name, proRating: pro.rating,
            sub: P.price, disc: bk.disc, gst: Math.round(P.price * 0.18), total: total(), payMethod: bk.payMethod,
            coupon: bk.coupon, notes: bk.notes || '',
            walletUsed: bk.payMethod === 'wallet' ? Math.min(Store.state.wallet, total()) : 0,
          });
          if (bk.payMethod === 'wallet') { const used = Math.min(Store.state.wallet, total()); Store.walletTx(-used, 'booking ' + b.id); }
          Store.sendMsg(b.id, `Hi! This is ${pro.name} from Servehub. Your ${s.name} booking for ${fmtDate(b.date)} at ${b.time} is confirmed. See you soon! 👋`, 'them');
          Store.addNotif('calendar', 'Booking confirmed', `Booking ${b.id} for ${s.name} on ${fmtDate(b.date)} at ${b.time} is confirmed. Track it live!`);
          bk.step = 5; bk.confirmedId = b.id; saveBk();
          U.$('#bk-step', root).innerHTML = stepConfirm(b, s, pro);
          U.$('#bk-next', root).remove();
          const back = U.$('#bk-back', root); if (back) back.remove();
          U.$('.summary-card .btn-cta', root)?.parentElement?.remove();
        }, 1500);
        return;
      }
      if (bk.step === 5) { location.hash = '#/track/' + bk.confirmedId; return; }
      bk.step++;
      saveBk();
      U.$('#bk-step', root).innerHTML = stepBodyHtml(bk.step);
      wireStep(root);
    });
    U.$('#bk-back')?.addEventListener('click', () => { if (bk.step > 0) { bk.step--; saveBk(); U.$('#bk-step', root).innerHTML = stepBodyHtml(bk.step); wireStep(root); } });
    wireStep(root);
  };

  const stepBodyHtml = step => {
    const s = DATA.serviceById(bk.serviceId);
    const packs = packsOf(s);
    const today = new Date();
    const dateOpts = Array.from({ length: 14 }, (_, i) => { const d = new Date(today.getTime() + i * 86400000); return { ts: d.getTime(), day: d.toLocaleDateString('en-IN', { day: '2-digit' }), mon: d.toLocaleDateString('en-IN', { month: 'short' }), wd: d.toLocaleDateString('en-IN', { weekday: 'short' }) }; });
    const slots = ['09:00 AM', '10:30 AM', '12:00 PM', '01:30 PM', '03:00 PM', '04:30 PM', '06:00 PM', '07:30 PM'];
    const pros = DATA.prosForService(s);
    if (step === 0) return `
      <div style="margin-bottom:20px"><h3 style="font-size:18px">Choose your package</h3><p class="small muted">Every package includes the full service + 100% warranty + GST invoice.</p></div>
      ${packs.map((p, i) => `<div class="pack-row ${bk.pack === i ? 'on' : ''}" data-pack="${i}" tabindex="0"><div><div class="pk-name">${p.name} <span class="badge ${i === 1 ? 'badge-success' : i === 2 ? 'badge-warn' : 'badge-primary'}">${i === 1 ? 'Best value' : i === 2 ? 'Urgent' : 'Popular'}</span></div><div class="pk-desc">${p.desc} • ${p.dur}</div></div><div class="pk-price">${money(p.price)}</div></div>`).join('')}`;
    if (step === 1) return `
      <div style="margin-bottom:20px"><h3 style="font-size:18px">Pick a date</h3><p class="small muted">Earliest available: today, 09:00 AM</p></div>
      <div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:20px">${dateOpts.map((d, i) => `<button class="f-chip ${bk.date === d.ts ? 'on' : ''}" data-date="${d.ts}" style="flex:none;flex-direction:column;gap:2px;padding:10px 14px;line-height:1.2"><b style="font-size:13px">${i === 0 ? 'Today' : d.wd}</b><span>${d.day} ${d.mon}</span></button>`).join('')}</div>
      <h3 style="font-size:16px;margin-bottom:12px">Available time slots</h3>
      <div class="radio-pill" style="margin-bottom:20px">${slots.map(t => `<label><input type="radio" name="slot" value="${t}" ${bk.time === t ? 'checked' : ''}><span>${t}</span></label>`).join('')}</div>
      <div class="grid g2" style="grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px">
        <label class="pack-row" style="cursor:pointer"><input type="checkbox" id="bk-instant" ${bk.instant ? 'checked' : ''} style="display:none"><span style="display:flex;gap:10px">${icon('zap', 16)} <span><b>Instant booking</b><br><span class="pk-desc">Nearest expert, earliest slot</span></span></span></label>
        <label class="pack-row" style="cursor:pointer"><input type="checkbox" id="bk-emergency" ${bk.emergency ? 'checked' : ''} style="display:none"><span style="display:flex;gap:10px">${icon('rocket', 16)} <span><b>Emergency +₹99</b><br><span class="pk-desc">Priority dispatch, ~60 min</span></span></span></label>
      </div>`;
    if (step === 2) return `
      <div style="margin-bottom:20px"><h3 style="font-size:18px">Where should we come?</h3><p class="small muted">We use your address for booking & live tracking.</p></div>
      <div style="margin-bottom:16px;background:var(--surface-2);padding:14px;border-radius:14px;border:1px dashed var(--line)">
        <button type="button" class="btn btn-soft btn-block" id="bk-detect-loc" style="display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;font-weight:600">
          ${icon('navigation', 16)} Use current device location
        </button>
        <div id="bk-loc-status" class="small center" style="margin-top:6px"></div>
      </div>
      ${Store.state.addr.map(a => `<div class="pack-row ${bk.addr === a.id ? 'on' : ''}" data-addr="${a.id}" tabindex="0"><div><div class="pk-name">${icon('pin', 14)} ${esc(a.label)} ${a.primary ? '<span class="badge badge-primary">Default</span>' : ''}</div><div class="pk-desc">${esc(a.line)}, ${esc(a.area)}, ${esc(a.city)} — ${a.pin}</div></div><span class="verified">${icon('badgeCheck', 11)} Verified</span></div>`).join('')}
      <button class="btn btn-outline btn-block" data-act="add-addr">${icon('plus', 15)} Add new address</button>`;
    if (step === 3) return `

    if (step === 4) return `

  };

  const stepConfirm = (b, s, pro, mid) => {

    <h3 style="font-size:22px">Booking confirmed! 🎉</h3><p class="small muted" style="margin:8px 0 22px">Your booking <b>${id}</b> is locked in. Track your professional live.</p></div>
    <div class="card glass" style="padding:20px;margin-bottom:16px">
      <div class="sum-row"><span class="muted">Booking ID</span><b>${esc(id)}</b></div>

  const wireStep = root => {

    U.$('#bk-instant')?.addEventListener('change', e => { bk.instant = e.target.checked; saveBk(); });

    U.$$('[data-addr]', root).forEach(el => el.addEventListener('click', () => { bk.addr = el.dataset.addr; saveBk(); U.$$('[data-addr]', root).forEach(b => b.classList.toggle('on', b === el)); }));
    
    // Detect device location button handler
    const detectLocBtn = U.$('#bk-detect-loc', root);

    if (detectLocBtn) {

        if (!('geolocation' in navigator)) {

        if (locStatus) locStatus.innerHTML = `<span style="color:var(--primary-600)">Please allow location access on your device…</span>`;

        navigator.geolocation.getCurrentPosition(async pos => {
          detectLocBtn.innerHTML = `${icon('timer', 16)} Fetching location address…`;
          const { latitude, longitude } = pos.coords;
          try {
            let line = '', area = '', city = '', pin = '';
            const res = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${latitude}&longitude=${longitude}&localityLanguage=en`);
            if (res.ok) {
              const data = await res.json();
              city = data.city || data.principalSubdivision || 'Mumbai';
              area = data.locality || data.localityInfo?.informative?.[0]?.name || 'Current Area';
              line = [data.locality, data.city].filter(Boolean).join(', ') || 'Current location address';
              pin = data.postcode || '400001';
            }
            if (!line || !city) {
              const res2 = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}`);
              if (res2.ok) {
                const data2 = await res2.json();
                const addr = data2.address || {};
                line = data2.display_name ? data2.display_name.split(',').slice(0, 3).join(',') : 'Current location';
                area = addr.suburb || addr.neighbourhood || addr.residential || area || 'Locality';
                city = addr.city || addr.town || addr.state_district || city || 'City';
                pin = addr.postcode || pin || '400001';
              }
            }
            const newAddr = {
              id: 'a' + Date.now(),
              label: 'Current Location',
              line: line || 'Current device position',
              area: area || 'Detected Area',
              city: city || 'Detected City',
              pin: (pin || '400001').replace(/\D/g, '').slice(0, 6) || '400001',
              primary: true
            };
            Store.state.addr.forEach(x => x.primary = false);
            Store.state.addr.unshift(newAddr);
            Store.persist();
            bk.addr = newAddr.id;
            saveBk();
            toast('📍 Current device location selected!');
            U.$('#bk-step', root).innerHTML = stepBodyHtml(bk.step);
            wireStep(root);
          } catch (e) {
            if (locStatus) locStatus.innerHTML = `<span style="color:var(--warn-600)">Could not reverse-geocode location. Please add address manually.</span>`;
            toast('Could not detect location address', 'warn');
            detectLocBtn.disabled = false;
            detectLocBtn.innerHTML = `${icon('navigation', 16)} Use current device location`;
          }
        }, err => {
          detectLocBtn.disabled = false;
          detectLocBtn.innerHTML = `${icon('navigation', 16)} Use current device location`;
          if (err.code === 1) {
            if (locStatus) locStatus.innerHTML = `<span style="color:var(--danger-600)">Location permission denied. Please allow location access in your device/browser settings.</span>`;
            toast('Location permission denied', 'warn');
          } else {
            if (locStatus) locStatus.innerHTML = `<span style="color:var(--danger-600)">Location unavailable. Please enter address manually.</span>`;
            toast('Location unavailable', 'warn');
          }
        }, { enableHighAccuracy: true, timeout: 10000 });
      });
    }

    U.$$('[data-pro]', root).forEach(el => el.addEventListener('click', () => { if (el.dataset.pro === 'auto') { bk.autoPro = true; bk.pro = null; } else { bk.autoPro = false; bk.pro = el.dataset.pro; } saveBk(); U.$$('[data-pro]', root).forEach(b => b.classList.toggle('on', b === el)); }));
    U.$$('[data-pay]', root).forEach(el => el.addEventListener('click', () => { bk.payMethod = el.dataset.pay; saveBk(); U.$$('[data-pay]', root).forEach(b => { b.classList.toggle('on', b === el); const ic = b.querySelector('.ic'); if (ic) ic.innerHTML = b === el ? icon('checkCircle', 18) : ''; }); U.$('#pay-detail', root).innerHTML = payDetailHtml(); wirePay(root); }));
    U.$('#bk-apply-coupon')?.addEventListener('click', applyCouponFn);

  const wirePay = root => {

    if (bk.payMethod === 'wallet') {

      det.innerHTML = `<div class="card glass" style="padding:16px;display:flex;justify-content:space-between;align-items:center"><div><b>Wallet balance</b><div style="font-size:20px;font-weight:900;color:var(--success-600)">${money(bal)}</div></div>${bal >= total() ? `<span class="badge badge-success">${icon('check', 12)} Sufficient</span>` : `<span class="badge badge-warn">Need ₹${money(total() - bal)} more</span>`}</div>`;

  /* ---------------- TRACK ---------------- */
  const TrackPage = ({ id }) => {

    if (!b) return `<section class="section"><div class="container"><div class="empty-state"><div class="e-ic">${icon('alert', 30)}</div><h3>Booking not found</h3><a class="btn btn-primary" href="#/dashboard">Go to dashboard</a></div></div></section>`;
    const idx = Store.statusIndex(b);
    const isCancelled = ['cancelled', 'rejected'].includes(b.status);
    const done = idx >= 5;
    const s = DATA.serviceById(b.serviceId);
    const pro = DATA.proById(b.proId) || { name: b.proName, rating: b.proRating, tags: [] };
    const chat = Store.getChat(b.id);
    return `
    <section class="section" style="padding-top:calc(var(--nav-h) + 28px)">
      <div class="container" style="max-width:1060px">

        <div class="main-head"><div><h2>${isCancelled ? 'Booking cancelled' : 'Live booking status'}</h2>
          <div class="greet">${b.serviceName} • ${fmtDate(b.date)} at ${b.time} • ${b.id}</div></div>
          <div style="display:flex;gap:10px;flex-wrap:wrap">${!isCancelled && idx < 2 ? `<button class="btn btn-outline btn-sm" data-act="resched" data-id="${b.id}">${icon('refreshCw', 14)} Reschedule</button>` : ''}${!isCancelled && idx < 3 ? `<button class="btn btn-danger btn-sm" data-act="cancel-bk" data-id="${b.id}">${icon('calendarX', 14)} Cancel</button>` : ''}${idx >= 4 ? `<a class="btn btn-primary btn-sm" href="#/invoice/${b.id}">${icon('file', 14)} Invoice</a>` : ''}</div>
        </div>

        ${isCancelled ? `<div class="card" style="padding:32px;text-align:center"><div class="e-ic" style="width:72px;height:72px;border-radius:22px;background:${b.status === 'rejected' ? 'var(--warn-50)' : 'var(--danger-50)'};color:${b.status === 'rejected' ? 'var(--warn-600)' : 'var(--danger)'};display:grid;place-items:center;margin:0 auto 16px">${icon(b.status === 'rejected' ? 'alert' : 'calendarX', 30)}</div><h3>${b.status === 'rejected' ? 'This booking was rejected' : 'This booking was cancelled'}</h3><p class="small muted" style="margin:8px 0 18px">${b.status === 'rejected' ? 'The professional could not take this slot. We are finding you a replacement — or book a new time.' : money(b.total) + ' has been refunded ' + (b.walletUsed ? 'to your wallet' : 'to your original payment method') + '.'}</p><a class="btn btn-primary" href="#/categories">Book a new service</a></div></div>` : `
        <div class="grid" style="grid-template-columns:1fr 1fr;gap:24px;align-items:start">
          <div class="card" style="padding:26px">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px"><h3 style="font-size:16px">Booking timeline</h3>${U.statusPill(b.status)}</div>
            <div class="timeline">
              ${Store.STATUSES.map((st, i) => i === 6 ? '' : `
              <div class="tl-item ${i < idx ? 'done' : i === idx ? 'now' : ''}">
                <div class="tl-title">${st.label}</div>
                <div class="tl-sub">${i < idx ? 'Completed ' + fmtTime(Date.now() - (idx - i) * 900000) : i === idx ? (i === 0 ? 'Confirmed just now' : 'In progress…') : 'Upcoming'}</div>

            </div>
            <div style="display:flex;gap:10px;margin-top:16px">

            </div>

                ${avatar(pro.name, 52, (b.proId || 'p').charCodeAt(1))}

              </div>
              <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">${(pro.tags || []).slice(0, 3).map(t => `<span class="pro-tag">${esc(t)}</span>`).join('')}</div>
              <button class="btn btn-outline btn-sm btn-block" style="margin-top:14px" data-act="navigate" data-id="${b.id}">${icon('navigation', 14)} Start GPS navigation</button>
            </div>
