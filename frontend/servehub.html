          `<button class="mini-btn no" data-mgr-act="coupon-del" data-code="${esc(c.code)}" title="Delete">${icon('trash', 14)}</button>`,
        ],
      }));
      return table(['Code', 'Discount', 'Min. order', 'Description', 'Valid till', 'Status'], rows, {
        empty: 'No coupons yet — create one to promote your services',
        right: `${srcBadge(src, items.length)}<button class="btn btn-primary btn-sm" data-mgr-act="coupon-new">${icon('plus', 13)} New coupon</button>`,
      });
    },
    giftcards(items, src) {
      const rows = items.map(g => ({
        cells: [`<b style="letter-spacing:.04em">${esc(g.code)}</b>`, money(g.value), money(g.balance || 0), g.expiresAt || '—', g.ownerUserId ? 'Redeemed' : 'Unclaimed', statusChip(g.status, { active: 'badge-success', redeemed: 'badge-primary', expired: 'badge-neutral' })],
        actions: [
          `<button class="mini-btn ${g.status === 'active' ? 'warn' : 'ok'}" data-mgr-act="gift-toggle" data-id="${g.id}" title="${g.status === 'active' ? 'Expire' : 'Re-activate'}">${icon(g.status === 'active' ? 'pause' : 'play', 14)}</button>`,
          `<button class="mini-btn no" data-mgr-act="gift-del" data-id="${g.id}" title="Delete">${icon('trash', 14)}</button>`,
        ],
      }));
      return table(['Code', 'Value', 'Balance', 'Expires', 'Owner', 'Status'], rows, {
        empty: 'No gift cards yet — create one to sell to customers',
        right: `${srcBadge(src, items.length)}<button class="btn btn-primary btn-sm" data-mgr-act="gift-new">${icon('plus', 13)} New gift card</button>`,
      });
    },
    plans(items, src) {
      return `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">${srcBadge(src, items.length)}</div>
      <div class="grid g3" style="grid-template-columns:repeat(3,1fr)">${items.map(p => `
        <div class="card plan-card ${p.featured ? 'featured' : ''}" style="min-height:240px">${p.featured ? '<span class="pl-ribbon">Flagship</span>' : ''}
          <b>${esc(p.name)}</b><div class="plan-price">${p.price === 0 ? 'Free' : money(p.price)}<small>/${p.per || 'month'}</small></div>
          <div class="small muted" style="flex:1">${(p.perks || []).length} perks • ${p.active === false ? 'Deactivated' : 'Active'}</div>
          <div style="display:flex;gap:8px"><button class="btn btn-outline btn-sm" style="flex:1" data-mgr-act="plan-edit" data-id="${esc(p.id)}">${icon('edit', 13)} Edit</button>
          <button class="btn btn-soft btn-sm ${p.active === false ? 'ok' : ''}" data-mgr-act="plan-toggle" data-id="${esc(p.id)}">${icon(p.active === false ? 'play' : 'pause', 13)} ${p.active === false ? 'Activate' : 'Pause'}</button></div>
        </div>`).join('') || '<div class="tbl-wrap"><div class="tbl-empty">No plans</div></div>'}</div>`;
    },
    tickets(items, src) {
      const rows = items.map(t => ({
        cells: [`<b style="font-size:13px">${esc(t.id)}</b>`, esc(t.customerName || 'Customer'), esc(t.subject), esc(t.category || 'other'), timeAgo(t.createdAt), statusChip(t.status, { open: 'badge-warn', 'in-progress': 'badge-primary', resolved: 'badge-success', closed: 'badge-neutral' })],
        actions: [`<button class="mini-btn blue" data-mgr-act="ticket-view" data-id="${t.id}" title="Open thread">${icon('eye', 14)}</button>`],
      }));
      return table(['Ticket', 'Customer', 'Subject', 'Category', 'Age', 'Status'], rows, {
        empty: 'No support tickets',
        right: srcBadge(src, items.length),
        search: false,
      });
    },
    reviews(items, src) {
      const rows = items.map(r => ({
        cells: [`<div style="display:flex;gap:10px;align-items:center">${avatar(r.customerName || 'Customer', 32)}<b style="font-size:13px">${esc(r.customerName || 'Customer')}</b></div>`, esc(r.serviceName || '—'), stars(r.rating), `<span class="small muted" style="max-width:220px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.text || '')}</span>`, statusChip(r.status, { published: 'badge-success', pending: 'badge-warn', hidden: 'badge-neutral' })],
        actions: [
          `<button class="mini-btn blue" data-mgr-act="review-view" data-id="${r.id}" title="View">${icon('eye', 14)}</button>`,
          r.status !== 'published' ? `<button class="mini-btn ok" data-mgr-act="review-approve" data-id="${r.id}" title="Approve">${icon('check', 14)}</button>` : `<button class="mini-btn warn" data-mgr-act="review-hide" data-id="${r.id}" title="Hide">${icon('eyeOff', 14)}</button>`,
          `<button class="mini-btn no" data-mgr-act="review-del" data-id="${r.id}" title="Remove">${icon('trash', 14)}</button>`,
        ],
      }));
      return table(['Customer', 'Service', 'Rating', 'Review', 'Status'], rows, {
        empty: 'No reviews yet',
        right: `${srcBadge(src, items.length)}<span class="badge badge-neutral">${items.filter(r => r.status === 'pending').length} pending</span>`,
        search: false,
      });
    },
  };

  /* -------- actions -------- */
  const wireManagedActions = (body, name) => {
    // Only ever attach one delegated listener — reloads replace innerHTML but
    // keep the same #mgr-body element, so a guard prevents listener buildup.
    if (body.dataset.mgrWired) return;
    body.dataset.mgrWired = '1';
    body.addEventListener('click', async e => {
      const btn = e.target.closest('[data-mgr-act]');
      if (!btn) return;
      const act = btn.dataset.mgrAct;
      const reload = () => managedLoad(name);
      const st = mgrState[name] || { src: 'demo', items: [] };
      const items = st.items;

      if (act === 'coupon-new') {
        openModal(modalShell('New coupon', `
          <div class="field"><label class="label">Code</label><input class="input" id="cp-code" placeholder="e.g. MONSOON25" style="text-transform:uppercase"></div>
          <div class="grid g2" style="grid-template-columns:1fr 1fr;gap:10px">
            <div class="field"><label class="label">Type</label><select class="select" id="cp-type"><option value="percent">Percent</option><option value="flat">Flat ₹</option></select></div>
            <div class="field"><label class="label">Value</label><input class="input" id="cp-value" type="number" placeholder="20"></div>
          </div>
          <div class="grid g2" style="grid-template-columns:1fr 1fr;gap:10px">
            <div class="field"><label class="label">Min. order (₹)</label><input class="input" id="cp-min" type="number" value="0"></div>
            <div class="field"><label class="label">Max discount (₹)</label><input class="input" id="cp-cap" type="number" placeholder="optional"></div>
          </div>
          <div class="field"><label class="label">Valid until</label><input class="input" id="cp-valid" type="date"></div>
          <div class="field"><label class="label">Description</label><input class="input" id="cp-desc" placeholder="e.g. 20% off monsoon specials"></div>`, 
          `<button class="btn btn-ghost" data-act="close-modal">Cancel</button><button class="btn btn-primary" id="cp-save">${icon('save', 14)} Create coupon</button>`));
        U.$('#cp-save').addEventListener('click', async () => {
          const body2 = { code: U.$('#cp-code').value.trim(), type: U.$('#cp-type').value, value: Number(U.$('#cp-value').value || 0), minAmount: Number(U.$('#cp-min').value || 0), cap: U.$('#cp-cap').value ? Number(U.$('#cp-cap').value) : null, validUntil: U.$('#cp-valid').value, description: U.$('#cp-desc').value };
          if (!body2.code) { toast('Coupon code is required', 'warn'); return; }
          const r = await apiPost('/admin/coupons', body2);
          if (r && r.coupon) { toast('Coupon ' + r.coupon.code + ' created 🎟️', 'success'); closeModal(); reload(); }
          else { items.unshift({ ...body2, active: true }); toast('Coupon created (demo)', 'success'); closeModal(); reload(); }
        });
      }
      if (act === 'coupon-edit') {
        const c = items.find(x => String(x.code) === String(btn.dataset.code));
        if (!c) return;
        openModal(modalShell('Edit coupon — ' + esc(c.code), `
          <div class="sum-row"><span class="muted">Discount</span><b>${c.type === 'percent' ? c.value + '% off' : money(c.value)}</b></div>
          <div class="sum-row"><span class="muted">Min. order</span><b>${money(c.minAmount || 0)}</b></div>
          <div class="sum-row"><span class="muted">Valid till</span><b>${c.validUntil || '—'}</b></div>
          <div class="field" style="margin-top:12px"><label class="label">Status</label><select class="select" id="cp-st"><option value="true" ${c.active !== false ? 'selected' : ''}>Active</option><option value="false" ${c.active === false ? 'selected' : ''}>Inactive</option></select></div>`, 
          `<button class="btn btn-ghost" data-act="close-modal">Cancel</button><button class="btn btn-primary" id="cp-save">${icon('save', 14)} Save</button>`));
        U.$('#cp-save').addEventListener('click', async () => {
          const active = U.$('#cp-st').value === 'true';
          const r = await apiPatch('/admin/coupons/' + encodeURIComponent(c.code), { active });
          if (r && r.coupon) toast('Coupon updated ✅', 'success'); else { c.active = active; toast('Coupon updated (demo) ✅', 'success'); }
          closeModal(); reload();
        });
      }
      if (act === 'coupon-toggle') {
        const c = items.find(x => String(x.code) === String(btn.dataset.code));
        if (!c) return;
        const next = c.active === false;
        const r = await apiPatch('/admin/coupons/' + encodeURIComponent(c.code), { active: next });
        if (!r || !r.coupon) c.active = next;
        toast('Coupon ' + c.code + (next ? ' activated' : ' deactivated') + ' ✅'); reload();
      }
      if (act === 'coupon-del') {
        if (!confirm('Delete coupon ' + btn.dataset.code + '?')) return;
        await apiDelete('/admin/coupons/' + encodeURIComponent(btn.dataset.code));
        toast('Coupon deleted 🗑️'); reload();
      }
      if (act === 'gift-new') {
        openModal(modalShell('New gift card', `<div class="field"><label class="label">Value (₹)</label><div class="radio-pill">${[250, 500, 1000, 2000].map(a => `<label><input type="radio" name="gv" value="${a}" ${a === 500 ? 'checked' : ''}><span>${money(a)}</span></label>`).join('')}</div></div><div class="field"><label class="label">Expires</label><input class="input" id="gc-exp" type="date"></div>`, `<button class="btn btn-ghost" data-act="close-modal">Cancel</button><button class="btn btn-primary" id="gc-save">${icon('gift', 14)} Create</button>`));
        U.$('#gc-save').addEventListener('click', async () => {
          const value = Number(U.$('input[name="gv"]:checked')?.value || 500);
          const expiresAt = U.$('#gc-exp').value || '';
          const r = await apiPost('/admin/giftcards', { value, expiresAt });
          if (r && r.giftCard) { toast('Gift card ' + r.giftCard.code + ' created 🎁', 'success'); }
          else { items.unshift({ id: 'new' + Date.now(), code: 'GIFT' + Math.floor(1000 + Math.random() * 9000), value, balance: value, expiresAt, status: 'active' }); toast('Gift card created (demo) 🎁', 'success'); }
          closeModal(); reload();
        });
      }
      if (act === 'gift-toggle') {
        const g = items.find(x => String(x.id) === String(btn.dataset.id));
        if (!g) return;
        const next = g.status === 'active' ? 'expired' : 'active';
        const r = await apiPatch('/admin/giftcards/' + g.id, { status: next });
        if (!r || !r.giftCard) g.status = next;
        toast('Gift card ' + g.code + ' → ' + next + ' ✅'); reload();
      }
      if (act === 'gift-del') {
        if (!confirm('Delete gift card?')) return;
        await apiDelete('/admin/giftcards/' + btn.dataset.id);
        toast('Gift card deleted 🗑️'); reload();
      }
      if (act === 'plan-edit') {
        const p = items.find(x => String(x.id) === String(btn.dataset.id));
        if (!p) return;
        openModal(modalShell('Edit plan — ' + esc(p.name), `
          <div class="field"><label class="label">Monthly price (₹)</label><input class="input" id="pl-price" type="number" value="${p.price}"></div>
          <label style="display:flex;gap:8px;align-items:center;font-size:13px;font-weight:600;margin:10px 0"><input type="checkbox" id="pl-feat" ${p.featured ? 'checked' : ''}> Featured / flagship</label>
          <div class="field"><label class="label">Perks (one per line)</label><textarea class="textarea" id="pl-perks" rows="4">${esc((p.perks || []).join('\n'))}</textarea></div>`,
          `<button class="btn btn-ghost" data-act="close-modal">Cancel</button><button class="btn btn-primary" id="pl-save">${icon('save', 14)} Save plan</button>`));
        U.$('#pl-save').addEventListener('click', async () => {
          const patch = { price: Number(U.$('#pl-price').value || 0), featured: U.$('#pl-feat').checked, perks: U.$('#pl-perks').value.split('\n').map(s => s.trim()).filter(Boolean) };
          const r = await apiPatch('/admin/plans/' + encodeURIComponent(p.id), patch);
          if (r && r.plan) toast('Plan updated ✅', 'success'); else { Object.assign(p, patch); toast('Plan updated (demo) ✅', 'success'); }
          closeModal(); reload();
        });
      }
      if (act === 'plan-toggle') {
        const p = items.find(x => String(x.id) === String(btn.dataset.id));
        if (!p) return;
        const next = p.active === false;
        const r = await apiPatch('/admin/plans/' + encodeURIComponent(p.id), { active: next });
        if (!r || !r.plan) p.active = next;
        toast(p.name + (next ? ' activated' : ' paused') + ' ✅'); reload();
      }
      if (act === 'ticket-view') {
        const t = items.find(x => String(x.id) === String(btn.dataset.id));
        if (!t) return;
        const msgs = (t.messages || []).map(m => `<div class="msg ${m.from === 'admin' ? 'me' : 'them'}" style="align-self:${m.from === 'admin' ? 'flex-end' : 'flex-start'}">${esc(m.text)}<span class="m-time">${timeAgo(m.createdAt)}</span></div>`).join('') || '<div class="small muted center">No messages yet</div>';
        openModal(modalShell('Ticket ' + t.id + ' — ' + esc(t.subject), `
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px"><span class="badge badge-neutral">${esc(t.customerName || 'Customer')}</span><span class="badge badge-neutral">${esc(t.category || 'other')}</span>${statusChip(t.status, { open: 'badge-warn', 'in-progress': 'badge-primary', resolved: 'badge-success', closed: 'badge-neutral' })}</div>
          <div class="chat-body" style="max-height:220px;border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;overflow-y:auto">${msgs}</div>
          <div class="chat-input-row" style="padding:12px 0 0"><input class="input" id="tk-reply" placeholder="Type a reply…"><button class="btn btn-primary" id="tk-send">${icon('send', 0)}</button></div>
          <div style="display:flex;gap:8px;margin-top:14px"><button class="btn btn-success btn-sm" style="flex:1" id="tk-resolve">${icon('check', 13)} Mark resolved</button><button class="btn btn-outline btn-sm" style="flex:1" data-act="close-modal">Close</button></div>`));
        const send = async () => {
          const text = (U.$('#tk-reply')?.value || '').trim();
          if (!text) return;
          const r = await apiPost('/admin/tickets/' + t.id + '/reply', { text });
          if (r && r.ticket) { toast('Reply sent ✅', 'success'); } else { t.messages = t.messages || []; t.messages.push({ from: 'admin', text, createdAt: Date.now() }); t.status = 'in-progress'; toast('Reply sent (demo) ✅', 'success'); }
          closeModal(); reload();
        };
        U.$('#tk-send').addEventListener('click', send);
        U.$('#tk-reply').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
        U.$('#tk-resolve').addEventListener('click', async () => {
          const r = await apiPatch('/admin/tickets/' + t.id, { status: 'resolved' });
          if (r && r.ticket) toast('Ticket resolved 🎉', 'success'); else { t.status = 'resolved'; toast('Ticket resolved (demo) 🎉', 'success'); }
          closeModal(); reload();
        });
      }
      if (act === 'review-view') {
        const r = items.find(x => String(x.id) === String(btn.dataset.id));
        if (!r) return;
        openModal(modalShell('Review by ' + esc(r.customerName || 'Customer'), `
          <div style="display:flex;gap:12px;align-items:center;margin-bottom:12px">${avatar(r.customerName || 'Customer', 40)}<div><b style="font-size:14px">${esc(r.customerName || 'Customer')}</b><div style="margin-top:2px">${stars(r.rating)}</div></div><span class="badge badge-neutral" style="margin-left:auto">${esc(r.serviceName || '—')}</span></div>
          <p class="small" style="line-height:1.65">${esc(r.text || 'No text')}</p>
          <div style="display:flex;gap:8px;margin-top:14px">${r.verified ? '<span class="badge badge-success">Verified customer</span>' : '<span class="badge badge-neutral">Unverified</span>'}<span class="badge badge-neutral">${r.helpful || 0} helpful votes</span></div>`,
          `<button class="btn btn-ghost" data-act="close-modal">Close</button>${r.status !== 'published' ? `<button class="btn btn-success" data-mgr-act="review-approve" data-id="${r.id}" data-inmodal="1">${icon('check', 13)} Approve</button>` : ''}`));
        const appBtn = U.$('[data-mgr-act="review-approve"][data-inmodal]');
        if (appBtn) appBtn.addEventListener('click', async () => {
          const rr = await apiPatch('/admin/reviews/' + r.id, { status: 'published' });
          if (rr && rr.review) toast('Review approved ✅', 'success'); else { r.status = 'published'; toast('Review approved (demo) ✅', 'success'); }
          closeModal(); reload();
        });
      }
      if (act === 'review-approve') {
        const r = items.find(x => String(x.id) === String(btn.dataset.id));
        if (!r) return;
        const rr = await apiPatch('/admin/reviews/' + r.id, { status: 'published' });
        if (rr && rr.review) toast('Review approved ✅', 'success'); else { r.status = 'published'; toast('Review approved (demo) ✅', 'success'); }
        reload();
      }
      if (act === 'review-hide') {
        const r = items.find(x => String(x.id) === String(btn.dataset.id));
        if (!r) return;
        const rr = await apiPatch('/admin/reviews/' + r.id, { status: 'hidden' });
        if (rr && rr.review) toast('Review hidden 👁️‍🗨️', 'success'); else { r.status = 'hidden'; toast('Review hidden (demo) 👁️‍🗨️', 'success'); }
        reload();
      }
      if (act === 'review-del') {
        const r = items.find(x => String(x.id) === String(btn.dataset.id));
        if (!r) return;
        if (!confirm('Permanently remove this review?')) return;
        await apiDelete('/admin/reviews/' + r.id);
        toast('Review removed 🗑️'); reload();
      }
    });
  };

  const render = (params) => {
    const tab = params.tab || 'overview';
    if (!Store.isLoggedIn() || Store.currentUser()?.role !== 'admin') { location.hash = '#/admin-login'; return { html: '', wire: null }; }
    if (!tabs[tab]) return { html: layout('overview', tabs.overview()), wire: () => {} };
    const html = layout(tab, tabs[tab]());
    const wire = () => {
      wireTableSearch(document); U.observeReveals(); setTimeout(animateBars, 120);
      if (tab === 'monitor') startMonitor();
      if (MANAGED.includes(tab)) managedLoad(tab);
    };
    return { html, wire };
  };

  let monIv = null;
  const startMonitor = () => {
    clearInterval(monIv);
    monIv = setInterval(() => {
      U.$$('[data-live]').forEach(card => {
        const b = Store.bookingById(card.dataset.live);
        if (!b) return;
        const pill = U.$('[data-live-pill]', card);
        if (pill) pill.innerHTML = statusPill(b.status);
      });
      const cnt = U.$('#live-count');
      if (cnt) cnt.textContent = Store.state.bookings.filter(x => !['cancelled', 'paid', 'rated'].includes(x.status)).length;
    }, 4000);
  };

  return { render, clearMonitor: () => clearInterval(monIv) };
})();

</script>
  <script>
/* ============ SERVEHUB CHATBOT v3 — Nova Smart Service Assistant ============
   Features:
   - Real-time intent recognition for AC, Plumbing, Electrical, Cleaning, Appliance Repair, etc.
   - Natural language search integration with dynamic "💰 Cheapest" badge computation.
   - Rich in-chat service recommendation cards featuring images, prices, ratings, duration, badges, and direct Book Now triggers.
   - Conversation context memory to remember user requirements across multiple turns.
   - Photo identification to recognize issues from uploaded images.
   - Quick action buttons ("Book Cheapest", "View All Services", etc.).
   ========================================================================== */
window.Chatbot = (() => {
  const { icon, esc, money } = U;

  let open = false;
  let root = null;

  /* Conversation Context Memory */
  let memory = {
    lastCategory: null,
    lastQuery: '',
    lastServices: [],
    cheapestService: null,
  };

  const userName = () => (Store.currentUser() || {}).name || '';
  const latestBooking = () => Store.state.bookings[0] || null;

  /* Quick action chips */
  const CHIPS = ['🔧 AC Repair', '🚰 Plumbing', '⚡ Electrician', '🧹 Cleaning', '💬 What services?', '💰 Cheapest AC Repair', '📱 My Bookings', '📸 Identify by photo'];

  /* ---- Render rich service card inside chat window ---- */
  const renderChatSvcCard = s => {
    const cat = DATA.catBySlug ? DATA.catBySlug(s.cat) : null;
    const img = s.img || `https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=400&q=80&fit=crop`;
    return `
    <div class="cb-card-item" data-svc-id="${esc(s.id)}" style="position:relative;background:var(--card);border:1.5px solid ${s.isCheapest ? 'var(--success-600)' : 'var(--line)'};border-radius:14px;overflow:hidden;margin-top:10px;box-shadow:var(--sh-sm);transition:.2s">
      ${s.isCheapest ? `<div style="position:absolute;top:8px;left:8px;z-index:2;background:linear-gradient(135deg,#10B981,#059669);color:#fff;font-weight:800;font-size:11px;padding:3px 9px;border-radius:999px;box-shadow:0 2px 8px rgba(16,185,129,.35)">💰 CHEAPEST</div>` : ''}
      <div style="position:relative;height:120px;width:100%;overflow:hidden;background:var(--surface-2)">
        <img src="${img}" alt="${esc(s.name)}" style="width:100%;height:100%;object-fit:cover;display:block" onerror="this.style.display='none'">
        <span style="position:absolute;bottom:8px;right:8px;background:rgba(15,23,42,.75);color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;backdrop-filter:blur(4px)">⏱ ${esc(s.dur)}</span>
      </div>
      <div style="padding:12px">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
          <div>
            <h4 style="font-size:14px;font-weight:800;color:var(--ink);margin:0;line-height:1.2">${esc(s.name)}</h4>
            <div style="font-size:11.5px;color:var(--ink-3);margin-top:2px">${esc(cat ? cat.name : s.cat)}</div>
          </div>
          <span style="font-size:12px;font-weight:700;color:var(--warn-600);background:var(--warn-50);padding:2px 6px;border-radius:6px;flex:none">★ ${s.rating}</span>
        </div>
        <p style="font-size:12px;color:var(--ink-2);margin:8px 0 10px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${esc(s.desc)}</p>
        <div style="display:flex;justify-content:space-between;align-items:center;padding-top:8px;border-top:1px solid var(--line-2)">
          <div>
            <span style="font-size:10px;color:var(--ink-3);display:block;font-weight:600">Starting from</span>
            <span style="font-size:16px;font-weight:900;color:var(--success-600)">${money(s.price)}</span>
          </div>
          <div style="display:flex;gap:6px">
            <a href="#/service/${esc(s.id)}" class="btn btn-outline btn-sm" style="font-size:11.5px;padding:6px 10px" onclick="window.Chatbot.close()">Details</a>
            <a href="#/book/${esc(s.id)}" class="btn btn-primary btn-sm" style="font-size:11.5px;padding:6px 12px" onclick="window.Chatbot.close()">Book Now</a>
          </div>
        </div>
      </div>
    </div>`;
  };

  /* ---- Photo identification mapping ---- */
  const PHOTO_KEYWORDS = [
    { words: ['water','leak','pipe','tap','drip','flood','plumb','toilet','bathroom','cistern'], cat: 'plumber', label: 'Plumbing Repair' },
    { words: ['ac','air','cool','compressor','refriger','fridge','freeze','hvac'], cat: 'ac', label: 'AC Service / Cooling Repair' },
    { words: ['wire','electric','switch','fan','light','bulb','mcb','fuse','spark','socket'], cat: 'electrician', label: 'Electrical Repair' },
    { words: ['dirty','dust','stain','clean','mop','floor','mess','bathroom'], cat: 'cleaning', label: 'Home Cleaning' },
    { words: ['sofa','carpet','mattress','upholster','couch'], cat: 'homeclean', label: 'Upholstery Deep Cleaning' },
    { words: ['furniture','door','hinge','wardrobe','cabinet','drawer','wood','kitchen'], cat: 'carpenter', label: 'Carpentry Repair' },
    { words: ['paint','wall','crack','peel','colour','texture'], cat: 'painting', label: 'Wall Painting' },
    { words: ['pest','cockroach','ant','termite','insect','rodent','rat','lizard'], cat: 'pest', label: 'Pest Control' },
    { words: ['laptop','computer','screen','keyboard','battery','charging'], cat: 'laptop', label: 'Laptop Repair' },
    { words: ['washing','machine','appliance','microwave','geyser','dishwasher'], cat: 'appliance', label: 'Appliance Repair' },
  ];

  const identifyFromText = filename => {
    const lower = (filename || '').toLowerCase().replace(/[_\-\.]/g, ' ');
    for (const kw of PHOTO_KEYWORDS) {
      if (kw.words.some(w => lower.includes(w))) return kw;
    }
    return null;
  };

  /* ---- Core Assistant Logic with Natural Language & Context Memory ---- */
  const processQuery = userText => {
    const text = userText.toLowerCase().trim();

    // 1. Check for booking tracking
    if (/(track|status|where is|arriv|live (tracking|status|updates)|my booking)/i.test(text)) {
      const b = latestBooking();
      if (b) {
        return {
          text: `You have <b>${Store.state.bookings.length}</b> booking(s). Your latest booking is <b>${esc(b.id)}</b> — current status: <b>${esc(b.status)}</b>. Tap below to follow live. 🗺️`,
          actions: [{ label: 'Track Latest Booking', href: '#/track/' + b.id }]
        };
      }
      return {
        text: `You don't have any active bookings yet. Browse our top services and get booked in under a minute!`,
        actions: [{ label: 'Browse All Services', href: '#/categories' }]
      };
    }

    // 2. Check for cancellations/refunds
    if (/(cancel|reschedul)/i.test(text)) {
      return {
        text: `You can cancel for free up to 24h before your slot (instant wallet refund) and reschedule free up to 6h before. Go to <b>My Bookings</b> to manage your appointment. ✅`,
        actions: [{ label: 'Manage My Bookings', href: '#/dashboard/bookings' }]
      };
    }

    // 3. Human support
    if (/(human|agent|support|real person|call|talk|complaint|representative)/i.test(text)) {
      return {
        text: `Connecting you to a live support agent right now… Our team usually responds in under 60 seconds! 🙌`,
        human: true
      };
    }

    // 3b. "What services do you provide?"
    if (/(what services|services do you provide|what do you offer|list of services|all services|which services|what can you)/i.test(text)) {
      return {
        text: `ServeHub offers <b>${DATA.categories.length} categories</b> and 340+ home services — AC repair &amp; service, plumbing, electrical, home cleaning, pest control, painting, carpentry, appliance repair, salon, spa and more. Here are the most popular right now:`,
        cards: DATA.services.filter(s => s.popular).slice(0, 3),
        actions: [
          { label: 'Browse all services', href: '#/categories', primary: true },
          { label: 'Explore categories', href: '#/categories' }
        ]
      };
    }

    // 3c. Price queries: "What is the price of AC service?"
    if (/(price|cost|rate|charge|how much)/i.test(text)) {
      const clean = text.replace(/\b(what is|whats|what|the|price|cost|rate|charge|of|for|how much|tell me|show|me|please|a|an)\b/g, ' ').replace(/\s+/g, ' ').trim().replace(/[?.,!]+$/g, '');
      const svcs = clean ? DATA.searchServices(clean) : DATA.services.filter(s => s.popular);
      if (svcs.length) {
        const cheapest = svcs.reduce((a, b) => a.price <= b.price ? a : b);
        memory.lastQuery = text; memory.lastServices = svcs; memory.cheapestService = cheapest; memory.lastCategory = svcs[0].cat;
        return {
          text: `Here are the current <b>ServeHub starting prices</b>${clean ? ' for “' + esc(clean) + '”' : ''} — the final price may vary after an on-site inspection:`,
          cards: svcs.slice(0, 3),
          cheapest,
          actions: [{ label: 'View all options', href: `#/category/${svcs[0].cat}`, primary: true }]
        };
      }
    }

    // 3d. "Cheapest …" — compare available services honestly
    if (/\b(cheap|cheapest|lowest|budget|affordable|low price|low cost|best price)\b/i.test(text)) {
      const clean = text.replace(/\b(cheap|cheapest|lowest|budget|affordable|show|me|the|price|best|for|near|please)\b/g, ' ').replace(/\s+/g, ' ').trim();
      const svcs = clean ? DATA.searchServices(clean) : DATA.services.filter(s => s.popular);
      if (svcs.length) {
        const cheapest = svcs.reduce((a, b) => a.price <= b.price ? a : b);
        const catName = DATA.catBySlug(cheapest.cat)?.name || 'Service';
        memory.lastQuery = text; memory.lastServices = svcs; memory.cheapestService = cheapest; memory.lastCategory = cheapest.cat;
        return {
          text: `For <b>${esc(catName)}</b>, the <b>lowest starting price among the currently available ServeHub services</b> is <b>${money(cheapest.price)}</b> — <b>${esc(cheapest.name)}</b>. The final price can vary after an on-site inspection.`,
          cards: svcs.slice(0, 3),
          cheapest,
          actions: [
            { label: `Book Now (${money(cheapest.price)})`, href: `#/book/${cheapest.id}`, primary: true },
            { label: 'View Details', href: `#/service/${cheapest.id}` }
          ]
        };
      }
    }

    // 4. Natural Language Service Intent Search
    const searchResults = DATA.searchServices(text);

    if (searchResults && searchResults.length > 0) {
      // For specific problems ("fridge not cooling") rank the most relevant
      // service first — the cheapest badge still marks the lowest price.
      const isSpecificProblem = /(not cooling|water leaking|noise|broken|fault|leak|issue|problem|not working|repair|service)/i.test(text);
      let ranked = searchResults;
      if (isSpecificProblem) {
        const probWords = text
          .replace(/\b(i|need|my|is|not|book|an|a|the|for|me|please|want|have|to|get|some|help|with|it)\b/g, ' ')
          .replace(/[^a-z ]/g, ' ').split(/\s+/).filter(w => w.length > 2);
        const score = s => {
          let sc = 0;
          (s.keywords || []).forEach(k => probWords.forEach(w => { if (k.toLowerCase().includes(w)) sc += 3; }));
          if (s.name.toLowerCase().split(/[\s-]+/).some(w => probWords.includes(w))) sc += 2;
          return sc;
        };
        ranked = [...searchResults].sort((a, b) => (score(b) - score(a)) || (b.bookings - a.bookings));
      }

      // Find lowest starting price among the matched set
      let minPrice = Infinity;
      let cheapestSvc = null;
      searchResults.forEach(s => {
        if (s.price < minPrice) {
          minPrice = s.price;
          cheapestSvc = s;
        }
      });

      // Update memory
      memory.lastQuery = text;
      memory.lastServices = searchResults;
      memory.cheapestService = cheapestSvc;
      if (ranked[0]) memory.lastCategory = ranked[0].cat;

      const categoryName = DATA.catBySlug(ranked[0].cat)?.name || 'Service';

      const responsePrefix = isSpecificProblem
        ? `I'm sorry to hear you're experiencing a ${categoryName} issue! I found suitable services for you. The <b>lowest starting price among the currently available ServeHub services</b> is <b>${money(cheapestSvc.price)}</b>:`
        : `I found <b>${searchResults.length}</b> verified ${categoryName} services — starting from <b>${money(cheapestSvc.price)}</b> (the final price may vary after inspection):`;

      return {
        text: responsePrefix,
        cards: ranked.slice(0, 3),
        cheapest: cheapestSvc,
        actions: [
          { label: `Book Cheapest (${money(cheapestSvc.price)})`, href: `#/book/${cheapestSvc.id}`, primary: true },
          { label: 'View All Services', href: `#/category/${ranked[0].cat}` }
        ]
      };
    }

    // 5. Context-aware follow ups using Memory
    if (memory.lastCategory && /(yes|cooling|leak|noise|repair|book|option|cheapest|sure|okay|help)/i.test(text)) {
      const svcs = DATA.searchServices(memory.lastCategory);
      if (svcs.length > 0) {
        const cheapest = memory.cheapestService || svcs[0];
        return {
          text: `Got it! For your ${memory.lastCategory.toUpperCase()} request, I recommend <b>${esc(cheapest.name)}</b> — the <b>lowest starting price among the currently available ServeHub services</b> is <b>${money(cheapest.price)}</b>.`,
          cards: svcs.slice(0, 3),
          cheapest: cheapest,
          actions: [
            { label: `Book ${cheapest.name} (${money(cheapest.price)})`, href: `#/book/${cheapest.id}`, primary: true }
          ]
        };
      }
    }

    // 6. Generic Fallback
    return {
      text: `Hello${userName() ? ' <b>' + esc(userName().split(' ')[0]) + '</b>' : ''}! I'm <b>Nova</b>, your ServeHub assistant. I can help you find services, locate the <b>cheapest options</b>, or identify issues from a photo 📸.`,
      cards: DATA.services.filter(s => s.popular).slice(0, 3),
      actions: [
        { label: 'Browse All Categories', href: '#/categories' }
      ]
    };
  };

  /* -------- Handle Photo Upload -------- */
  const handlePhoto = file => {
    if (!file || !file.type.startsWith('image/')) {
      addMsg('Please upload a valid image file (JPG, PNG, WEBP). 🖼️', 'them');
      return;
    }
    const reader = new FileReader();
    reader.onload = e => {
      addMsg(`<img src="${e.target.result}" alt="Uploaded photo" style="max-width:220px;max-height:160px;border-radius:10px;display:block;margin-bottom:6px"><span style="font-size:12px;color:var(--ink-3)">📎 ${esc(file.name)}</span>`, 'me');
      typing(true);
      setTimeout(() => {
        typing(false);
        const match = identifyFromText(file.name);
        if (match) {
          const svcs = DATA.searchServices(match.cat);
          const cheapest = svcs[0];
          addMsg(`🔍 I identified this as a <b>${esc(match.label)}</b> issue! Here are the best services recommended for you — the lowest starting price among the currently available ServeHub services is <b>${money(cheapest ? cheapest.price : 199)}</b> (final price may vary after inspection):`, 'them');
          if (svcs.length) {
            addMsg(svcs.slice(0, 3).map(renderChatSvcCard).join(''), 'them');
            if (cheapest) {
              addMsg(`<div style="display:flex;gap:8px;margin-top:10px"><a href="#/book/${cheapest.id}" class="btn btn-primary btn-sm" onclick="window.Chatbot.close()">Book Cheapest (${money(cheapest.price)}) →</a></div>`, 'them');
            }
          }
        } else {
          addMsg(`📸 Image received! Based on common home repair issues, here are our top recommended services:`, 'them');
          const topSvcs = DATA.searchServices('repair');
          addMsg(topSvcs.slice(0, 3).map(renderChatSvcCard).join(''), 'them');
        }
        updateChips(['🔧 AC Repair', '🚰 Plumbing', '⚡ Electrician', '🧹 Cleaning']);
      }, 1100);
    };
    reader.readAsDataURL(file);
  };

  /* -------- Dynamic Chip Buttons -------- */
  const updateChips = chips => {
    if (!root) return;
    const el = U.$('#cb-chips', root);
    if (!el) return;
    el.innerHTML = chips.map(c => `<button class="quick-chip" data-cb-chip="${esc(c)}">${esc(c)}</button>`).join('');
    el.querySelectorAll('[data-cb-chip]').forEach(b => b.addEventListener('click', () => send(b.dataset.cbChip)));
  };

  /* ---------------- UI Builder ---------------- */
  const openPanel = () => {
    if (open) return;
    open = true;
    root = document.createElement('div');
    root.className = 'chatbot';
    root.setAttribute('role', 'dialog');
    root.setAttribute('aria-label', 'Nova — ServeHub Service Assistant');
    root.innerHTML = `
      <div class="chatbot-head">
        <div class="cb-avatar">${icon('sparkles', 18)}</div>
        <div class="cb-id"><b>Nova — ServeHub Assistant</b><div class="cb-sub"><span class="status-dot dot-green"></span> Online · replies instantly</div></div>
        <button class="icon-btn" id="cb-close" aria-label="Close chat">${icon('x', 18)}</button>
      </div>
      <div class="chatbot-body" id="cb-body">
        <div class="msg them">Hi${userName() ? ' <b>' + esc(userName().split(' ')[0]) + '</b>' : ''}! 👋 I'm <b>Nova</b>. Ask me anything like <i>"AC not cooling"</i>, <i>"cheapest AC repair"</i>, or <i>"plumber"</i> — I'll find the best options and mark the <b>cheapest suitable service</b>! 💰</div>
      </div>
      <div class="chatbot-chips" id="cb-chips">${CHIPS.map(c => `<button class="quick-chip" data-cb-chip="${esc(c)}">${esc(c)}</button>`).join('')}</div>
      <div class="chatbot-input">
        <label class="cb-photo-btn" title="Upload photo to identify service" aria-label="Upload photo">
          ${icon('camera', 18)}
          <input type="file" id="cb-photo-input" accept="image/*" style="display:none">
        </label>
        <input class="input" id="cb-input" placeholder="Describe your problem or service needed…" aria-label="Ask Nova">
        <button class="btn btn-primary" id="cb-send" aria-label="Send">${icon('send', 0)}</button>
      </div>`;
    document.body.appendChild(root);
    const badge = document.querySelector('.fab-chat .fab-badge');
    if (badge) badge.style.display = 'none';
    requestAnimationFrame(() => { root.classList.add('show'); const inp = U.$('#cb-input', root); if (inp) inp.focus(); });
    bind(root);
  };

  const closePanel = () => {
    if (!root) return;
    const el = root;
    el.classList.remove('show');
    const badge = document.querySelector('.fab-chat .fab-badge');
    if (badge) badge.style.display = '';
    setTimeout(() => { if (el && el.parentNode) el.remove(); if (root === el) root = null; }, 220);
    open = false;
  };

  const toggle = () => (open ? closePanel() : openPanel());

  /* ---------------- Messaging & Rendering ---------------- */
  const addMsg = (html, from, time = Date.now()) => {
    const body = U.$('#cb-body');
    if (!body) return;
    body.insertAdjacentHTML('beforeend', `<div class="msg ${from}">${html}<span class="m-time">${new Date(time).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' })}</span></div>`);
    body.scrollTop = body.scrollHeight;
  };

  const typing = on => {
    const body = U.$('#cb-body');
    if (!body) return;
    if (on) body.insertAdjacentHTML('beforeend', `<div class="msg them typing"><i></i><i></i><i></i></div>`);
    else U.$('.msg.typing', body)?.remove();
    body.scrollTop = body.scrollHeight;
  };

  const send = raw => {
    const text = String(raw || '').trim();
    if (!text) return;

    if (text === '📸 Identify by photo') {
      addMsg('📸 Please select or drop a photo of your issue below:', 'them');
      setTimeout(() => { const inp = U.$('#cb-photo-input', root); if (inp) inp.click(); }, 350);
      return;
    }

    addMsg(esc(text), 'me');
    typing(true);

    setTimeout(() => {
      typing(false);
      const res = processQuery(text);
      
      addMsg(res.text, 'them');

      if (res.cards && res.cards.length > 0) {
        addMsg(res.cards.map(renderChatSvcCard).join(''), 'them');
      }

      if (res.human) {
        addMsg(`<button class="btn btn-primary btn-sm" data-cb-call="human">Chat with Human Support ${icon('arrowRight', 13)}</button>`, 'them');
      } else if (res.actions && res.actions.length > 0) {
        const actionHtml = `<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">` +
          res.actions.map(a => `<a href="${esc(a.href)}" class="btn ${a.primary ? 'btn-primary' : 'btn-outline'} btn-sm" onclick="window.Chatbot.close()">${esc(a.label)} ${icon('arrowRight', 13)}</a>`).join('') +
          `</div>`;
        addMsg(actionHtml, 'them');
      }

      updateChips(['🔧 AC Repair', '🚰 Plumbing', '⚡ Electrician', '🧹 Cleaning', '📱 My Bookings']);
    }, 650);
  };

  /* ---------------- Event Listeners ---------------- */
  const bind = rootEl => {
    const input = U.$('#cb-input', rootEl);
    const photoInput = U.$('#cb-photo-input', rootEl);

    const doSend = () => { const v = input?.value || ''; if (v.trim()) { input.value = ''; send(v); } };
    U.$('#cb-send', rootEl)?.addEventListener('click', doSend);
    input?.addEventListener('keydown', e => { if (e.key === 'Enter') doSend(); });
    U.$('#cb-close', rootEl)?.addEventListener('click', closePanel);

    photoInput?.addEventListener('change', e => {
      const file = e.target.files[0];
      if (file) handlePhoto(file);
      e.target.value = '';
    });

    rootEl.addEventListener('dragover', e => { e.preventDefault(); rootEl.classList.add('drag-over'); });
    rootEl.addEventListener('dragleave', () => rootEl.classList.remove('drag-over'));
    rootEl.addEventListener('drop', e => {
      e.preventDefault();
      rootEl.classList.remove('drag-over');
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) handlePhoto(file);
    });

    U.$$('[data-cb-chip]', rootEl).forEach(c => c.addEventListener('click', () => send(c.dataset.cbChip)));

    rootEl.addEventListener('click', e => {
      const human = e.target.closest('[data-cb-call="human"]');
      if (human) { closePanel(); if (window.Booking) Booking.chatModal('ServeHub Support'); return; }
      const link = e.target.closest('a[href^="#"]');
      if (link) closePanel();
    });
  };

  document.addEventListener('keydown', e => { if (e.key === 'Escape' && open) closePanel(); });

  return { toggle, open: openPanel, close: closePanel, send };
})();

</script>

        <a class="m-link" href="#/become-pro">${icon('briefcase', 17)} For professionals</a>

        <a class="m-link" href="#/help">${icon('headset', 17)} Support</a>
        <a class="m-link" href="#/about">${icon('info', 17)} About us</a>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px">
          ${user ? `<a class="btn btn-primary" href="${dash}">${icon('user', 15)} My dashboard</a>` : `<a class="btn btn-primary" href="#/login">${t('login')}</a>`}
          <a class="btn btn-outline" href="#/categories">${t('book')}</a>
          <button class="btn btn-soft" data-act="install-app" style="grid-column:1/-1">${icon('download', 16)} Install app</button>
        </div>
      </div>
    </header>`;
  };

  const footer = () => `
    <footer class="footer">
      <div class="container">
        <div class="footer-grid">
          <div>
            <a class="logo" href="#/"><span class="logo-mark">${icon('zap', 20)}</span>Serve<b>hub</b></a>
            <p class="f-about">Reliable home services at your doorstep.</p>
            <div class="f-social">

      try { sessionStorage.setItem('sh:redirect', location.hash); } catch (e) {}

      out = Auth.render('login') || { html: '', wire: null };
      out.lay = 'auth';
      location.hash = '#/login';
    }
    const lay = out.lay || r.lay;
    const noFloat = ['book', 'track', 'invoice'].includes(r?.name);
    app.innerHTML = lay === 'public' ? publicLayout(out.html, !noFloat) : out.html;

    'approve-pro': el => { const a = Store.state.proApps.find(x => x.id === el.dataset.id); if (a) { a.status = 'approved'; Store.persist(); toast(a.name + ' approved! They can now accept bookings 🎉'); renderRoute(); } },
    'reject-pro': el => { const a = Store.state.proApps.find(x => x.id === el.dataset.id); if (a) { a.status = 'rejected'; Store.persist(); toast(a.name + ' rejected — applicant notified', 'info'); renderRoute(); } },
    'view-pro': el => { const a = Store.state.proApps.find(x => x.id === el.dataset.id); if (a) openModal(modalShell('Review application — ' + a.id, `<div class="sum-row"><span class="muted">Name</span><b>${esc(a.name)}</b></div><div class="sum-row"><span class="muted">Category</span><b>${esc(a.cat)}</b></div><div class="sum-row"><span class="muted">City</span><b>${esc(a.city)}</b></div><div class="sum-row"><span class="muted">Experience</span><b>${a.exp} years</b></div><div class="sum-row"><span class="muted">Phone</span><b>${esc(a.phone || '—')}</b></div><hr class="divider"><p class="small muted">Documents: Aadhaar ✓ • Selfie ✓ • Certificate — pending</p>`, `<button class="btn btn-danger" data-act="reject-pro" data-id="${a.id}">Reject</button><button class="btn btn-success" data-act="approve-pro" data-id="${a.id}">${icon('check', 14)} Approve</button>`)); },
    'admin-advance': el => { Store.advanceBooking(el.dataset.id); toast('Status advanced'); App.refresh(); },
    'broadcast': () => { const title = U.$('#bc-title')?.value || 'New offer'; const msg = U.$('#bc-msg')?.value || 'Check out the latest offers on Servehub!'; Store.addNotif('bell', title, msg); toast('Broadcast sent to 2.4M users 📣'); U.$('#bc-title').value = ''; U.$('#bc-msg').value = ''; },
    'apply': el => { openModal(modalShell('Apply — ' + el.dataset.role, `<div class="field"><label class="label">Full name</label><input class="input" placeholder="Your name"></div><div class="field"><label class="label">Email</label><input class="input" type="email" placeholder="you@example.com"></div><div class="field"><label class="label">Resume / portfolio</label><label class="upload-zone" style="padding:16px"><div class="u-ic" style="width:40px;height:40px">${icon('upload', 18)}</div><b style="font-size:13px">Upload file</b><input type="file" style="display:none"></label></div>`, `<button class="btn btn-ghost" data-act="close-modal">Cancel</button><button class="btn btn-primary" data-act="toast" data-msg="Application received! We will reach out within 5 days 🤝">Submit application</button>`)); },
    'detect-location': () => { toast('GPS: location detected — Bandra, Mumbai 📍', 'success'); },
  };

  const toggleTheme = () => {
    Store.state.theme = Store.state.theme === 'dark' ? 'light' : 'dark';
    Store.persist();
    document.documentElement.dataset.theme = Store.state.theme;
    U.$$('[data-act="theme"]').forEach(b => b.innerHTML = icon(Store.state.theme === 'dark' ? 'sun' : 'moon', 18));
    toast(Store.state.theme === 'dark' ? 'Dark mode on 🌙' : 'Light mode on ☀️', 'info');
  };

  /* ---------------- delegation ---------------- */
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (el && actions[el.dataset.act]) { if (el.dataset.close) closeModal(); actions[el.dataset.act](el, e); return; }
    // ripple on .btn
    const btn = e.target.closest('.btn');
    if (btn && !btn.classList.contains('btn-ghost') && !e.target.closest('[data-act]')) {
      const r = document.createElement('span'); r.className = 'ripple';
      const rect = btn.getBoundingClientRect();
      r.style.left = (e.clientX - rect.left - 20) + 'px'; r.style.top = (e.clientY - rect.top - 20) + 'px';
      r.style.width = r.style.height = '40px';
      btn.appendChild(r); setTimeout(() => r.remove(), 560);
    }
  });
  document.addEventListener('submit', e => {
    if (e.target.id === 'login-form') { e.preventDefault(); const role = U.$('input[name="role"]:checked', e.target)?.value || 'customer'; const email = U.$('#l-email').value.trim() || 'demo@servehub.in'; Auth.doLogin(role, email); }
    if (e.target.id === 'reg-form') { e.preventDefault(); Auth.startRegister(); }
    if (e.target.id === 'forgot-form') { e.preventDefault(); toast('Reset code sent to your email 📩', 'info'); location.hash = '#/forgot-otp'; }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeModal(); const m = U.$('#mobile-menu'); m && m.classList.remove('open'); }
    if (e.key === '/' && !/input|textarea|select/i.test(document.activeElement.tagName)) { e.preventDefault(); openSearch(); }
  });
  document.addEventListener('change', e => {
    const city = e.target.closest('.city-select');
    if (city) { Store.setLocation({ city: city.value, area: '' }); toast('📍 Location set to ' + Store.currentLocation().label); }
    const nf = e.target.closest('[data-notif]');
    if (nf) { Store.state.settings[nf.dataset.notif] = nf.checked; Store.persist(); }
  });

  /* ---------------- PWA: install banner + events ---------------- */
  const ensurePwaBar = () => {
    if (U.$('.pwa-bar') || (window.SH_PWA && SH_PWA.isStandalone())) return;
    const bar = document.createElement('div');
    bar.className = 'pwa-bar';
    bar.innerHTML = `<span class="pwa-logo">${icon('zap', 20)}</span><div><b style="font-size:13.5px">Install Servehub</b><div class="small muted">Full-screen app • works offline</div></div><div style="margin-left:auto;display:flex;gap:8px;align-items:center"><button class="icon-btn" data-act="pwa-dismiss" aria-label="Dismiss">${icon('x', 15)}</button><button class="btn btn-primary btn-sm" data-act="install-app">${icon('download', 14)} Install</button></div>`;
    document.body.appendChild(bar);
  };
  document.addEventListener('sh:pwa-ready', () => { let d = '0'; try { d = localStorage.getItem('sh:pwaDismissed') || '0'; } catch (e) {} if (d !== '1') ensurePwaBar(); });
  document.addEventListener('sh:pwa-standalone', () => { const bar = U.$('.pwa-bar'); bar && bar.remove(); });
  document.addEventListener('sh:pwa-installed', () => { const bar = U.$('.pwa-bar'); bar && bar.remove(); toast('Servehub installed — find it on your home screen 🎉', 'success'); });

  /* ---------------- init ---------------- */
  document.documentElement.dataset.theme = Store.state.theme;
  window.addEventListener('hashchange', renderRoute);
  window.App = { refresh: renderRoute, afterLogin };
  window.SH_PWA && SH_PWA.init();
  renderRoute();
})();

</script>
</body>
</html>
